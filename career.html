<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Log - Career</title>
    
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e11d48">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="https://res.cloudinary.com/dp6k1rwj/image/upload/v1794345597/wmremove-transformed.jpg">

    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#4c0519',
                        }
                    },
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #fff5f5 0%, #ffe4e6 100%); color: #4c0519; min-height: 100vh; }
    </style>
</head>
<body class="flex flex-col items-center justify-start p-4 md:p-8 pb-20">

    <!-- Main Container -->
    <div class="w-full max-w-2xl space-y-6">
        
        <!-- Header Nav -->
        <div class="border-b border-brand-200 pb-4 space-y-1">
            <button onclick="location.href='home.html'" class="inline-flex items-center space-x-1 text-xs font-bold text-brand-600 hover:text-brand-800 transition">
                <span>◀ กลับหน้าหลัก</span>
            </button>
            <h1 class="text-xl font-extrabold text-brand-900 whitespace-nowrap">💼 Career (ระบบการทำงาน)</h1>
        </div>

        <!-- กล่องแสดงยอดเงินในบัญชีปัจจุบัน (วางไว้ใต้หัวข้อเหมือนหน้า Estate) -->
        <div class="bg-white/90 backdrop-blur-md px-5 py-3 rounded-3xl border border-brand-200 shadow-sm flex items-center justify-between">
            <div class="text-xs text-gray-500 font-medium">💰 เงินในบัญชีปัจจุบัน</div>
            <div id="user-silver-display" class="text-sm font-extrabold text-brand-700">0 Silver</div>
        </div>

        <!-- Tab Switcher -->
        <div class="grid grid-cols-2 gap-2 bg-brand-100/80 p-1.5 rounded-2xl text-center">
            <button id="tab-main-btn" onclick="switchTab('main')" class="py-2.5 rounded-xl text-xs font-bold bg-brand-600 text-white shadow-sm transition">👔 งานหลัก (Main Job)</button>
            <button id="tab-side-btn" onclick="switchTab('side')" class="py-2.5 rounded-xl text-xs font-medium text-brand-800 hover:text-brand-600 transition">⚡ งานเสริม (Side Job)</button>
        </div>

        <!-- Section 1: งานหลัก (Main Job) -->
        <div id="view-main" class="space-y-4">
            <div id="main-job-view-container" class="space-y-4">
                <p class="text-center text-xs text-gray-400 py-10">กำลังโหลดข้อมูลงานหลัก...</p>
            </div>
        </div>

        <!-- Section 2: งานเสริม (Side Job) -->
        <div id="view-side" class="hidden space-y-4">
            <!-- ส่วนแสดงงานเสริมที่กำลังทำอยู่ (มีตัวจับเวลา) -->
            <div id="active-side-job-container"></div>

            <div class="bg-white/90 backdrop-blur-md p-4 rounded-3xl border border-brand-200 shadow-sm space-y-2">
                <h2 class="text-sm font-bold text-brand-900">⚡ รายการงานเสริมพาร์ทไทม์</h2>
                <p class="text-[11px] text-gray-500">เลือกทำงานเสริมเพื่อรับรายได้พิเศษ (ใช้พลังงาน หลอดอาหาร และต้องมีทักษะ)</p>
            </div>

            <!-- รายการงานเสริมทั้งหมด -->
            <div id="side-jobs-container" class="space-y-3">
                <p class="text-center text-xs text-gray-400 py-6">กำลังโหลดรายการงานเสริม...</p>
            </div>
        </div>

    </div>

    <!-- Modal แจ้งเตือนป๊อปอัพทั่วไป -->
    <div id="custom-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-brand-200 max-w-sm w-full p-6 text-center transform transition-all scale-95 opacity-0 duration-200" id="modal-box">
            <div id="modal-icon" class="w-16 h-16 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">✨</div>
            <h3 id="modal-title" class="text-lg font-bold text-brand-900 mb-2">แจ้งเตือนระบบ</h3>
            <p id="modal-message" class="text-sm text-gray-600 mb-6">ข้อความแจ้งเตือน...</p>
            <button onclick="closeModal()" class="bg-brand-600 text-white px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-gray-700 transition w-full shadow-md">ตกลง</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://alyifbjuugctlqiwcrny.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_79rKUSpeFSZbPtUpEPtiEw_t_saz9Hk';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        let currentUserId = null;
        let currentUserProfile = null;
        let activeBankAccount = null;
        let userSkillsMap = {};
        let careersCatalogData = [];
        let userMainJob = null;
        let activeSideJob = null;
        let timerInterval = null;

        function showModal(title, message, icon = '✨', cb = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
            window.modalCallback = cb;
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); if(window.modalCallback) window.modalCallback(); }, 200);
        }

        function switchTab(tab) {
            const mainBtn = document.getElementById('tab-main-btn');
            const sideBtn = document.getElementById('tab-side-btn');
            const mainView = document.getElementById('view-main');
            const sideView = document.getElementById('view-side');

            if (tab === 'main') {
                mainBtn.className = "py-2.5 rounded-xl text-xs font-bold bg-brand-600 text-white shadow-sm transition";
                sideBtn.className = "py-2.5 rounded-xl text-xs font-medium text-brand-800 hover:text-brand-600 transition";
                mainView.classList.remove('hidden');
                sideView.classList.add('hidden');
            } else {
                sideBtn.className = "py-2.5 rounded-xl text-xs font-bold bg-brand-600 text-white shadow-sm transition";
                mainBtn.className = "py-2.5 rounded-xl text-xs font-medium text-brand-800 hover:text-brand-600 transition";
                sideView.classList.remove('hidden');
                mainView.classList.add('hidden');
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUserId = session.user.id;

            await loadUserData();
            await loadActiveAccount();
            await loadUserSkills();
            await loadCareersCatalog();
            await loadUserCareer();
            loadActiveSideJobFromStorage();
        });

        async function loadUserData() {
            const { data } = await supabaseClient.from('profiles').select('*').eq('id', currentUserId).single();
            if (data) currentUserProfile = data;
        }

        async function loadActiveAccount() {
            const activeAccNo = sessionStorage.getItem('active_bank_acc');
            let query = supabaseClient.from('bank_accounts').select('*').eq('user_id', currentUserId);
            if (activeAccNo) query = query.eq('account_number', activeAccNo);

            const { data } = await query.limit(1);
            if (data && data.length > 0) {
                activeBankAccount = data[0];
                document.getElementById('user-silver-display').innerText = Number(activeBankAccount.silver).toLocaleString() + ' Silver';
            } else {
                const { data: fallback } = await supabaseClient.from('bank_accounts').select('*').eq('user_id', currentUserId).order('created_at', { ascending: true }).limit(1);
                if (fallback && fallback.length > 0) {
                    activeBankAccount = fallback[0];
                    document.getElementById('user-silver-display').innerText = Number(activeBankAccount.silver).toLocaleString() + ' Silver';
                }
            }
        }

        async function loadUserSkills() {
            const { data } = await supabaseClient.from('user_skills').select('*').eq('user_id', currentUserId);
            userSkillsMap = {};
            if (data) {
                data.forEach(s => { userSkillsMap[s.skill_name] = s; });
            }
        }

        async function loadCareersCatalog() {
            const { data } = await supabaseClient.from('careers_catalog').select('*').order('created_at', { ascending: true });
            careersCatalogData = data || [];
        }

        async function loadUserCareer() {
            const { data, error } = await supabaseClient
                .from('user_careers')
                .select('*, careers_catalog(*)')
                .eq('user_id', currentUserId)
                .maybeSingle();

            if (!error) {
                userMainJob = data;
            }
            renderMainJobSection();
            renderSideJobsSection();
        }

        function getSkillBonusMultiplier(skillName) {
            let skill = userSkillsMap[skillName];
            if (!skill) return 1.0;
            let lv = skill.level;
            if (lv <= 1) return 1.0;
            if (lv === 2) return 1.05;
            if (lv === 3) return 1.10;
            if (lv === 4 || lv === 5) return 1.15;
            if (lv === 6 || lv === 7) return 1.20;
            if (lv === 8) return 1.25;
            if (lv === 9) return 1.30;
            if (lv >= 10) return 1.50;
            return 1.0;
        }

        function renderMainJobSection() {
            const container = document.getElementById('main-job-view-container');

            if (!userMainJob) {
                let mainCatalogs = careersCatalogData.filter(c => c.type === 'main');
                
                let html = `
                    <div class="bg-white/95 backdrop-blur-md p-5 rounded-3xl border border-brand-200 shadow-sm text-center py-8 space-y-3">
                        <div class="w-16 h-16 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">👔</div>
                        <h3 class="font-bold text-sm text-brand-900">คุณยังไม่มีงานหลักประจำ</h3>
                        <p class="text-xs text-gray-500">เลือกสมัครงานหลักด้านล่างเพื่อเริ่มสร้างรายได้ประจำวัน</p>
                    </div>
                    <div class="bg-white/90 backdrop-blur-md p-4 sm:p-5 rounded-3xl border border-brand-200 shadow-sm space-y-3.5">
                        <h3 class="text-sm font-bold text-brand-950">📋 เลือกสมัครงานหลักใหม่</h3>
                        <div class="space-y-3">
                `;

                if (mainCatalogs.length === 0) {
                    html += '<p class="text-center text-xs text-gray-400 py-4">ยังไม่มีข้อมูลอาชีพงานหลักในระบบ</p>';
                } else {
                    mainCatalogs.forEach(c => {
                        let requiredSkill = c.required_skill_name;
                        let userSkillLevel = requiredSkill && userSkillsMap[requiredSkill] ? userSkillsMap[requiredSkill].level : 0;
                        let meetsRequirement = !requiredSkill || userSkillLevel >= c.required_skill_level;
                        let foodCostVal = c.food_cost !== undefined && c.food_cost !== null ? c.food_cost : 0;

                        html += `
                            <div class="bg-white/95 p-4 rounded-2xl border border-brand-200 shadow-sm flex items-center justify-between gap-3">
                                <div class="space-y-1">
                                    <h4 class="font-bold text-xs text-brand-950">💼 ${c.title}</h4>
                                    <p class="text-[10px] text-gray-500">รายได้: <span class="font-semibold text-brand-600">${Number(c.salary_or_reward).toLocaleString()} Silver/วัน</span> | พลังงาน: ⚡ ${c.energy_cost} | อาหาร: 🍲 ${foodCostVal}</p>
                                    ${requiredSkill ? `<p class="text-[10px] ${meetsRequirement ? 'text-emerald-600' : 'text-rose-600'} font-medium">ต้องการ: ${requiredSkill} (Lv.${c.required_skill_level}) ${meetsRequirement ? '✓ ผ่านเงื่อนไข' : '✗ ไม่ผ่าน'}</p>` : ''}
                                </div>
                                <button onclick="applyMainJob('${c.id}')" class="bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs px-4 py-2 rounded-xl transition shadow-sm shrink-0">
                                    สมัครงาน
                                </button>
                            </div>
                        `;
                    });
                }
                html += `</div></div>`;
                container.innerHTML = html;
            } else {
                let job = userMainJob.careers_catalog;
                let multiplier = getSkillBonusMultiplier(job.required_skill_name);
                let effectiveSalary = Math.round(Number(job.salary_or_reward) * multiplier * userMainJob.job_level);
                let foodCostVal = job.food_cost !== undefined && job.food_cost !== null ? job.food_cost : 0;

                container.innerHTML = `
                    <div class="bg-white/95 backdrop-blur-md p-6 rounded-3xl border-2 border-brand-300 shadow-md space-y-5">
                        <div class="flex justify-between items-start">
                            <div class="space-y-1">
                                <span class="bg-brand-100 text-brand-700 text-[10px] font-bold px-3 py-1 rounded-full shadow-sm">👔 งานหลักปัจจุบัน (Lv.${userMainJob.job_level})</span>
                                <h3 class="text-lg font-extrabold text-brand-950 mt-1">${job.title}</h3>
                            </div>
                            <button onclick="quitMainJob()" class="text-rose-600 hover:text-rose-800 text-xs font-bold px-3 py-1.5 rounded-xl bg-rose-50 border border-rose-200 transition shadow-sm">ลาออกจากงาน</button>
                        </div>
                        
                        <div class="grid grid-cols-3 gap-2 bg-brand-50/70 p-4 rounded-2xl border border-brand-100 text-xs text-center">
                            <div>
                                <span class="text-gray-500 block text-[10px]">รายได้สุทธิ (ต่อวัน)</span>
                                <strong class="text-brand-700 text-sm sm:text-base">${effectiveSalary.toLocaleString()} Silver</strong>
                                ${multiplier > 1 ? `<span class="text-[9px] text-emerald-600 block">(โบนัสสกิล x${multiplier})</span>` : ''}
                            </div>
                            <div>
                                <span class="text-gray-500 block text-[10px]">พลังงานที่ใช้/วัน</span>
                                <strong class="text-brand-700 text-sm sm:text-base">⚡ ${job.energy_cost}</strong>
                            </div>
                            <div>
                                <span class="text-gray-500 block text-[10px]">อาหารที่ใช้/วัน</span>
                                <strong class="text-emerald-700 text-sm sm:text-base">🍲 ${foodCostVal}</strong>
                            </div>
                        </div>

                        <!-- แถบบัตรรับเงินเข้าธนาคาร -->
                        <div class="bg-white p-4 rounded-2xl border border-brand-200 flex items-center justify-between shadow-inner">
                            <div>
                                <span class="text-[10px] text-gray-500 block">เงินเดือนสะสมรอรับเข้าบัญชี</span>
                                <span class="text-lg font-extrabold text-brand-600">${parseFloat(userMainJob.accrued_salary).toLocaleString()} Silver</span>
                            </div>
                            <button onclick="claimSalary()" class="bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs px-5 py-3 rounded-xl transition shadow-md">
                                กดรับเงินเดือน 💰
                            </button>
                        </div>

                        <!-- ปุ่มอัปเลเวลงาน (เลื่อนขั้น) -->
                        <div class="flex items-center justify-between pt-2 border-t border-brand-100">
                            <span class="text-xs text-gray-700 font-semibold">อัปเกรดตำแหน่งงาน (Lv.${userMainJob.job_level} ➔ ${userMainJob.job_level + 1})</span>
                            <button onclick="upgradeJobLevel()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition shadow-sm">
                                เลื่อนขั้น (${(userMainJob.job_level * 10000).toLocaleString()} Silver)
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        function renderSideJobsSection() {
            const container = document.getElementById('side-jobs-container');
            const sideCatalogs = careersCatalogData.filter(c => c.type === 'side');
            container.innerHTML = '';

            if (sideCatalogs.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-gray-400 py-6 bg-white/80 rounded-3xl border border-brand-100">ขณะนี้ยังไม่มีงานเสริมในระบบ</p>';
                return;
            }

            sideCatalogs.forEach(c => {
                let foodCostVal = c.food_cost !== undefined && c.food_cost !== null ? c.food_cost : 0;
                container.innerHTML += `
                    <div class="bg-white/95 backdrop-blur-md p-4 rounded-3xl border border-brand-200 shadow-sm flex items-center justify-between gap-3">
                        <div class="space-y-1">
                            <h4 class="font-bold text-xs text-brand-950">⚡ ${c.title}</h4>
                            <p class="text-[10px] text-gray-500">ค่าตอบแทน: <span class="font-semibold text-brand-600">${Number(c.salary_or_reward).toLocaleString()} Silver</span> | ⚡ พลังงาน: ${c.energy_cost} | 🍲 อาหาร: ${foodCostVal}</p>
                            <p class="text-[10px] text-brand-700 font-medium">⏱️ ระยะเวลาทำงาน: ${c.duration_minutes} นาที</p>
                        </div>
                        <button onclick="startSideJob('${c.id}', '${c.title}', ${c.salary_or_reward}, ${c.energy_cost}, ${foodCostVal}, ${c.duration_minutes}, '${c.required_skill_name || ''}')" class="bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition shadow-sm shrink-0">
                            เริ่มทำงาน
                        </button>
                    </div>
                `;
            });
        }

        async function applyMainJob(careerId) {
            // เช็คพลังงานและอาหารของผู้ใช้ก่อนสมัครงานหลัก (หรือเริ่มงาน)
            let selectedJob = careersCatalogData.find(c => c.id === careerId);
            if (selectedJob && currentUserProfile) {
                let energyReq = selectedJob.energy_cost || 0;
                let foodReq = selectedJob.food_cost || 0;
                let currentEnergy = currentUserProfile.energy !== undefined ? currentUserProfile.energy : 100;
                let currentFood = currentUserProfile.food !== undefined ? currentUserProfile.food : 100;

                if (currentEnergy < energyReq) {
                    showModal("พลังงานไม่พอ!", `งานนี้ต้องใช้พลังงาน ${energyReq} หน่วย แต่คุณเหลือ ${currentEnergy} หน่วย`, "⚡");
                    return;
                }
                if (currentFood < foodReq) {
                    showModal("หลอดอาหารไม่พอ!", `งานนี้ต้องใช้อาหาร ${foodReq} หน่วย แต่คุณเหลือ ${currentFood} หน่วย`, "🍲");
                    return;
                }

                // หักพลังงานและอาหารจริง
                let newEnergy = currentEnergy - energyReq;
                let newFood = currentFood - foodReq;
                await supabaseClient.from('profiles').update({ energy: newEnergy, food: newFood }).eq('id', currentUserId);
                currentUserProfile.energy = newEnergy;
                currentUserProfile.food = newFood;
            }

            if (userMainJob) {
                await supabaseClient.from('user_careers').update({ career_id: careerId, job_level: 1 }).eq('id', userMainJob.id);
            } else {
                await supabaseClient.from('user_careers').insert([{ user_id: currentUserId, career_id: careerId, job_level: 1, accrued_salary: 0 }]);
            }
            showModal("สมัครงานสำเร็จ! 🎉", "คุณได้เริ่มทำงานหลักนี้เรียบร้อยแล้ว", "💼", () => loadUserCareer());
        }

        async function quitMainJob() {
            if (!userMainJob) return;
            await supabaseClient.from('user_careers').delete().eq('id', userMainJob.id);
            userMainJob = null;
            showModal("ลาออกจากงานสำเร็จ", "คุณได้ลาออกจากงานหลักปัจจุบันแล้ว", "👋", () => loadUserCareer());
        }

        async function claimSalary() {
            if (!userMainJob || userMainJob.accrued_salary <= 0) {
                showModal("ไม่มีเงินเดือนสะสม", "ยังไม่มีเงินเดือนให้กดรับในขณะนี้", "⚠️");
                return;
            }
            if (!activeBankAccount) {
                showModal("ไม่พบบัญชีธนาคาร", "กรุณาสร้างบัญชีธนาคารก่อนกดรับเงินเดือน", "⚠️");
                return;
            }

            let amount = Number(userMainJob.accrued_salary);
            let newSilver = Number(activeBankAccount.silver) + amount;

            await supabaseClient.from('bank_accounts').update({ silver: newSilver }).eq('id', activeBankAccount.id);
            await supabaseClient.from('user_careers').update({ accrued_salary: 0 }).eq('id', userMainJob.id);

            activeBankAccount.silver = newSilver;
            document.getElementById('user-silver-display').innerText = newSilver.toLocaleString() + ' Silver';
            userMainJob.accrued_salary = 0;

            showModal("รับเงินเดือนสำเร็จ! 💰", `คุณได้รับเงินเดือนเข้าบัญชี ${amount.toLocaleString()} Silver เรียบร้อยแล้ว`, "🎉", () => renderMainJobSection());
        }

        async function upgradeJobLevel() {
            if (!userMainJob) return;
            let cost = userMainJob.job_level * 10000;

            if (!activeBankAccount || Number(activeBankAccount.silver) < cost) {
                showModal("เงินไม่พอ!", `การเลื่อนขั้นต้องการเงิน ${cost.toLocaleString()} Silver แต่คุณมีเงินไม่เพียงพอ`, "💰");
                return;
            }

            let newSilver = Number(activeBankAccount.silver) - cost;
            let newJobLevel = userMainJob.job_level + 1;

            await supabaseClient.from('bank_accounts').update({ silver: newSilver }).eq('id', activeBankAccount.id);
            await supabaseClient.from('user_careers').update({ job_level: newJobLevel }).eq('id', userMainJob.id);

            activeBankAccount.silver = newSilver;
            document.getElementById('user-silver-display').innerText = newSilver.toLocaleString() + ' Silver';
            userMainJob.job_level = newJobLevel;

            showModal("เลื่อนขั้นสำเร็จ! ⭐", `ยินดีด้วย! คุณได้รับการเลื่อนขั้นเป็นตำแหน่งระดับ ${newJobLevel} เรียบร้อยแล้ว`, "🎉", () => loadUserCareer());
        }

        // ระบบงานเสริมพร้อมจับเวลาถอยหลัง (ตรวจสอบและหักหลอดพลังงาน + หลอดอาหาร)
        function startSideJob(careerId, title, reward, energyCost, foodCost, durationMinutes, requiredSkill) {
            if (!currentUserProfile) return;

            let currentEnergy = currentUserProfile.energy !== undefined ? currentUserProfile.energy : 100;
            let currentFood = currentUserProfile.food !== undefined ? currentUserProfile.food : 100;

            if (currentEnergy < energyCost) {
                showModal("พลังงานไม่พอ!", `งานนี้ต้องใช้พลังงาน ${energyCost} หน่วย แต่คุณเหลือพลังงาน ${currentEnergy} หน่วย`, "⚡");
                return;
            }

            if (currentFood < foodCost) {
                showModal("หลอดอาหารไม่พอ!", `งานนี้ต้องใช้อาหาร ${foodCost} หน่วย แต่คุณเหลืออาหาร ${currentFood} หน่วย`, "🍲");
                return;
            }

            if (requiredSkill) {
                let skill = userSkillsMap[requiredSkill];
                if (!skill || (skill.level <= 1 && skill.points <= 0)) {
                    showModal("สกิลไม่ถึง!", `คุณยังไม่มีแต้มในทักษะ "${requiredSkill}" ที่จำเป็นสำหรับงานเสริมนี้`, "⚠️");
                    return;
                }
            }

            let multiplier = requiredSkill ? getSkillBonusMultiplier(requiredSkill) : 1.0;
            let finalReward = Math.round(reward * multiplier);
            let endTime = Date.now() + (durationMinutes * 60 * 1000);

            activeSideJob = {
                careerId,
                title,
                reward: finalReward,
                energyCost,
                foodCost,
                endTime
            };

            localStorage.setItem(`active_side_job_${currentUserId}`, JSON.stringify(activeSideJob));
            deductStatsForSideJob(energyCost, foodCost);
            renderActiveSideJobBox();
            showModal("เริ่มงานเสริมแล้ว! ⚡", `คุณได้เริ่มทำงานเสริม "${title}" (ใช้พลังงาน ${energyCost} | อาหาร ${foodCost}) ระบบกำลังดำเนินการ กรุณารอสักครู่`, "⏱️");
        }

        async function deductStatsForSideJob(energyCost, foodCost) {
            let newEnergy = (currentUserProfile.energy !== undefined ? currentUserProfile.energy : 100) - energyCost;
            let newFood = (currentUserProfile.food !== undefined ? currentUserProfile.food : 100) - foodCost;
            
            await supabaseClient.from('profiles').update({ energy: newEnergy, food: newFood }).eq('id', currentUserId);
            currentUserProfile.energy = newEnergy;
            currentUserProfile.food = newFood;
        }

        function loadActiveSideJobFromStorage() {
            const saved = localStorage.getItem(`active_side_job_${currentUserId}`);
            if (saved) {
                activeSideJob = JSON.parse(saved);
                renderActiveSideJobBox();
            }
        }

        function renderActiveSideJobBox() {
            const box = document.getElementById('active-side-job-container');
            if (!activeSideJob) {
                box.innerHTML = '';
                if (timerInterval) clearInterval(timerInterval);
                return;
            }

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                let remaining = activeSideJob.endTime - Date.now();
                const timerEl = document.getElementById('side-job-timer');
                const actionBtn = document.getElementById('side-job-action-btn');

                if (remaining <= 0) {
                    if (timerEl) timerEl.innerText = "ทำงานเสร็จสิ้นแล้ว! พร้อมรับเงิน";
                    if (actionBtn) {
                        actionBtn.innerText = "กดรับเงินค่าจ้าง 🎁";
                        actionBtn.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2.5 rounded-xl transition shadow-md";
                        actionBtn.onclick = claimSideJobReward;
                    }
                    clearInterval(timerInterval);
                } else {
                    let mins = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                    let secs = Math.floor((remaining % (1000 * 60)) / 1000);
                    if (timerEl) timerEl.innerText = `⏳ เหลือเวลาอีก: ${mins} นาที ${secs < 10 ? '0' : ''}${secs} วินาที`;
                }
            }, 1000);

            let remaining = activeSideJob.endTime - Date.now();
            let isFinished = remaining <= 0;

            box.innerHTML = `
                <div class="bg-white/95 backdrop-blur-md p-5 rounded-3xl border-2 border-brand-300 shadow-md space-y-3">
                    <div class="flex items-center space-x-2">
                        <span class="w-8 h-8 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center text-sm shadow-inner">⚡</span>
                        <h3 class="font-bold text-xs text-brand-900">งานเสริมที่กำลังทำ: ${activeSideJob.title}</h3>
                    </div>
                    <div class="bg-brand-50/70 p-3 rounded-2xl border border-brand-100 text-center space-y-1">
                        <p id="side-job-timer" class="text-xs font-bold text-brand-700">${isFinished ? "ทำงานเสร็จสิ้นแล้ว! พร้อมรับเงิน" : "กำลังคำนวณเวลา..."}</p>
                        <p class="text-[10px] text-gray-500">ค่าตอบแทนที่จะได้รับ: <strong class="text-brand-600">${activeSideJob.reward.toLocaleString()} Silver</strong></p>
                    </div>
                    <button id="side-job-action-btn" onclick="${isFinished ? 'claimSideJobReward()' : 'showModal(\"ยังไม่ถึงเวลา\", \"กรุณารอสักครู่จนกว่าจะครบกำหนดเวลา\", \"⏱️\")'}" class="${isFinished ? 'w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2.5 rounded-xl transition shadow-md' : 'w-full bg-gray-200 text-gray-500 font-bold text-xs py-2.5 rounded-xl cursor-not-allowed'}">
                        ${isFinished ? 'กดรับเงินค่าจ้าง 🎁' : 'กำลังดำเนินการทำงาน...'}
                    </button>
                </div>
            `;
        }

        async function claimSideJobReward() {
            if (!activeSideJob) return;
            if (!activeBankAccount) {
                showModal("ไม่พบบัญชีธนาคาร", "กรุณาสร้างบัญชีธนาคารก่อนรับเงิน", "⚠️");
                return;
            }

            let newSilver = Number(activeBankAccount.silver) + activeSideJob.reward;
            await supabaseClient.from('bank_accounts').update({ silver: newSilver }).eq('id', activeBankAccount.id);

            activeBankAccount.silver = newSilver;
            document.getElementById('user-silver-display').innerText = newSilver.toLocaleString() + ' Silver';

            let earnedAmount = activeSideJob.reward;
            localStorage.removeItem(`active_side_job_${currentUserId}`);
            activeSideJob = null;
            renderActiveSideJobBox();

            showModal("รับเงินค่าจ้างสำเร็จ! 🎁", `คุณได้รับเงิน ${earnedAmount.toLocaleString()} Silver เข้าธนาคารเรียบร้อยแล้ว`, "🎉");
        }
    </script>
</body>
</html>
