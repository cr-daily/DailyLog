<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Log - Estate</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e11d48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dp6k1rwj/image/upload/v1794345597/wmremove-transformed.jpg">

    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#4c0519',
                        }
                    },
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #fff5f5 0%, #ffe4e6 100%); color: #4c0519; min-height: 100vh; }
    </style>
</head>
<body class="flex flex-col items-center justify-start p-4 md:p-8 pb-20">

    <!-- Main Container -->
    <div class="w-full max-w-2xl space-y-6">
        
        <!-- Header Nav -->
        <div class="border-b border-brand-200 pb-4 flex items-center justify-between">
            <div class="space-y-1">
                <button onclick="handleBack()" class="inline-flex items-center space-x-1 text-xs font-bold text-brand-600 hover:text-brand-800 transition">
                    <span id="back-btn-text">◀ กลับหน้าหลัก</span>
                </button>
                <h1 id="header-title" class="text-xl font-extrabold text-brand-900 whitespace-nowrap">🏡 Estate (ระบบที่อยู่อาศัย)</h1>
            </div>
            <!-- ยอดเงินในบัญชีปัจจุบัน -->
            <div class="text-right bg-white/90 px-3 py-2 rounded-2xl border border-brand-200 shadow-sm shrink-0">
                <span class="text-[10px] text-gray-500 block">เงินในบัญชีปัจจุบัน</span>
                <span id="user-silver-display" class="text-xs font-extrabold text-brand-600">0 Silver</span>
            </div>
        </div>

        <!-- กล่องแสดงคำเชิญเข้าพัก (ถ้ามี) -->
        <div id="invites-container" class="space-y-3"></div>

        <!-- Tab Switcher (แสดงเฉพาะตอนอยู่หน้าหลักโครงการ) -->
        <div id="tab-switcher-box" class="grid grid-cols-3 gap-2 bg-brand-100/80 p-1.5 rounded-2xl text-center">
            <button id="tab-house-btn" onclick="switchCategory('house')" class="py-2.5 rounded-xl text-xs font-bold bg-brand-600 text-white shadow-sm transition">🏠 บ้าน</button>
            <button id="tab-condo-btn" onclick="switchCategory('condo')" class="py-2.5 rounded-xl text-xs font-medium text-brand-800 hover:text-brand-600 transition">🏢 คอนโด</button>
            <button id="tab-apt-btn" onclick="switchCategory('apartment')" class="py-2.5 rounded-xl text-xs font-medium text-brand-800 hover:text-brand-600 transition">🏨 อพาร์ตเมนต์</button>
        </div>

        <!-- Section: รายการโครงการ หรือ รายการยูนิตในโครงการ -->
        <div class="space-y-4">
            <div id="properties-container" class="space-y-4">
                <p class="text-center text-xs text-gray-400 py-10">กำลังโหลดข้อมูลที่อยู่อาศัย...</p>
            </div>
        </div>

    </div>

    <!-- Modal เชิญผู้อยู่อาศัย / รูมเมท -->
    <div id="invite-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-brand-200 max-w-sm w-full p-6 space-y-4">
            <div class="text-center">
                <div class="w-16 h-16 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center mx-auto mb-2 text-2xl shadow-inner">👥</div>
                <h3 class="text-lg font-bold text-brand-900">จัดการผู้อยู่อาศัย / รูมเมท</h3>
                <p class="text-xs text-gray-500">ชวนเพื่อนมาอยู่ร่วมกันโดยใช้ ID ผู้เล่น</p>
            </div>
            <div id="residents-list" class="space-y-2 max-h-40 overflow-y-auto text-xs text-gray-700">
                <!-- รายชื่อผู้อยู่อาศัย -->
            </div>
            <div class="space-y-2 pt-2">
                <input type="text" id="invite-user-custom-id" placeholder="กรอก ID ผู้เล่นที่ต้องการชวน (เช่น A1234)..." class="w-full px-4 py-2.5 rounded-xl border border-brand-200 text-xs focus:outline-none focus:border-brand-500">
                <div class="flex space-x-2">
                    <button onclick="sendInvite()" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs py-2.5 rounded-xl transition shadow-md">ชวนเพื่อน</button>
                    <button onclick="closeInviteModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold text-xs px-4 py-2.5 rounded-xl transition">ปิด</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal แจ้งเตือนป๊อปอัพทั่วไป -->
    <div id="custom-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-brand-200 max-w-sm w-full p-6 text-center transform transition-all scale-95 opacity-0 duration-200" id="modal-box">
            <div id="modal-icon" class="w-16 h-16 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">✨</div>
            <h3 id="modal-title" class="text-lg font-bold text-brand-900 mb-2">แจ้งเตือนระบบ</h3>
            <p id="modal-message" class="text-sm text-gray-600 mb-6">ข้อความแจ้งเตือน...</p>
            <button onclick="closeModal()" class="bg-brand-600 text-white px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-gray-700 transition w-full shadow-md">ตกลง</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://alyifbjuugctlqiwcrny.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_79rKUSpeFSZbPtUpEPtiEw_t_saz9Hk';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        let currentUserId = null;
        let currentCategory = 'house';
        let allProperties = [];
        let profilesMap = {};
        let managingPropertyId = null;
        let activeBankAccount = null;
        let selectedProjectName = null;
        let myCustomId = null;

        function showModal(title, message, icon = '✨') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        function switchCategory(category) {
            currentCategory = category;
            selectedProjectName = null;
            const houseBtn = document.getElementById('tab-house-btn');
            const condoBtn = document.getElementById('tab-condo-btn');
            const aptBtn = document.getElementById('tab-apt-btn');

            houseBtn.className = "py-2.5 rounded-xl text-xs font-medium text-brand-800 hover:text-brand-600 transition";
            condoBtn.className = "py-2.5 rounded-xl text-xs font-medium text-brand-800 hover:text-brand-600 transition";
            aptBtn.className = "py-2.5 rounded-xl text-xs font-medium text-brand-800 hover:text-brand-600 transition";

            if (category === 'house') houseBtn.className = "py-2.5 rounded-xl text-xs font-bold bg-brand-600 text-white shadow-sm transition";
            if (category === 'condo') condoBtn.className = "py-2.5 rounded-xl text-xs font-bold bg-brand-600 text-white shadow-sm transition";
            if (category === 'apartment') aptBtn.className = "py-2.5 rounded-xl text-xs font-bold bg-brand-600 text-white shadow-sm transition";

            renderContent();
        }

        function handleBack() {
            if (selectedProjectName) {
                selectedProjectName = null;
                renderContent();
            } else {
                window.location.href = 'home.html';
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUserId = session.user.id;

            await loadUserProfile();
            await loadActiveAccount();
            await loadProfiles();
            await loadProperties();
            await loadUserInvites();
        });

        async function loadUserProfile() {
            const { data } = await supabaseClient.from('profiles').select('custom_id').eq('id', currentUserId).single();
            if (data) {
                myCustomId = data.custom_id;
            }
        }

        async function loadActiveAccount() {
            const activeAccNo = sessionStorage.getItem('active_bank_acc');
            let query = supabaseClient.from('bank_accounts').select('*').eq('user_id', currentUserId);
            
            if (activeAccNo) query = query.eq('account_number', activeAccNo);

            const { data } = await query.limit(1);
            if (data && data.length > 0) {
                activeBankAccount = data[0];
                document.getElementById('user-silver-display').innerText = Number(activeBankAccount.silver).toLocaleString() + ' Silver';
            } else {
                const { data: fallback } = await supabaseClient.from('bank_accounts').select('*').eq('user_id', currentUserId).order('created_at', { ascending: true }).limit(1);
                if (fallback && fallback.length > 0) {
                    activeBankAccount = fallback[0];
                    document.getElementById('user-silver-display').innerText = Number(activeBankAccount.silver).toLocaleString() + ' Silver';
                } else {
                    document.getElementById('user-silver-display').innerText = '0 Silver';
                }
            }
        }

        async function loadProfiles() {
            const { data } = await supabaseClient.from('profiles').select('id, name, email, avatar, custom_id');
            if (data) {
                profilesMap = {};
                data.forEach(p => profilesMap[p.id] = p);
            }
        }

        async function loadProperties() {
            const { data, error } = await supabaseClient.from('properties').select('*');
            if (error) { console.error(error); return; }
            allProperties = data || [];
            renderContent();
        }

        async function loadUserInvites() {
            const container = document.getElementById('invites-container');
            container.innerHTML = '';

            if (!myCustomId) return;

            const { data: invites, error } = await supabaseClient
                .from('property_invites')
                .select('*, properties(*)')
                .eq('target_custom_id', myCustomId)
                .eq('status', 'pending');

            if (error || !invites || invites.length === 0) return;

            invites.forEach(inv => {
                const prop = inv.properties;
                const inviter = profilesMap[inv.inviter_id] ? profilesMap[inv.inviter_id].name : 'เพื่อนของคุณ';

                const card = document.createElement('div');
                card.className = "bg-brand-50 border-2 border-brand-300 p-4 rounded-3xl shadow-md flex flex-col sm:flex-row items-center justify-between gap-3 animate-pulse";
                card.innerHTML = `
                    <div class="space-y-1 text-center sm:text-left">
                        <span class="text-[10px] font-bold bg-brand-600 text-white px-2 py-0.5 rounded-full">📬 คำเชิญเข้าพัก</span>
                        <h4 class="font-bold text-xs text-brand-950 mt-1">${inviter} ชวนคุณมาอยู่ร่วมกันที่ "${prop ? prop.name : 'ที่อยู่อาศัย'} (${prop ? prop.room_code : ''})"</h4>
                        <p class="text-[10px] text-gray-500">คุณสามารถตอบรับเพื่อเข้ามาแชร์บิลค่าใช้จ่ายร่วมกันได้</p>
                    </div>
                    <div class="flex space-x-2 shrink-0">
                        <button onclick="respondInvite('${inv.id}', '${prop ? prop.id : ''}', 'accepted')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2 rounded-xl transition shadow-sm">ตกลง</button>
                        <button onclick="respondInvite('${inv.id}', '', 'declined')" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold text-xs px-4 py-2 rounded-xl transition">ปฏิเสธ</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function respondInvite(inviteId, propertyId, status) {
            await supabaseClient.from('property_invites').update({ status: status }).eq('id', inviteId);

            if (status === 'accepted' && propertyId) {
                showModal("ยินดีด้วย! 🎉", "คุณได้ตกลงเข้าอยู่อาศัยร่วมกันเรียบร้อยแล้ว", "🏡");
            } else {
                showModal("ปฏิเสธคำเชิญ", "คุณได้ปฏิเสธคำเชิญเรียบร้อยแล้ว", "❌");
            }

            loadUserInvites();
            loadProperties();
        }

        function renderContent() {
            const container = document.getElementById('properties-container');
            const tabSwitcher = document.getElementById('tab-switcher-box');
            const backBtnText = document.getElementById('back-btn-text');
            const headerTitle = document.getElementById('header-title');

            container.innerHTML = '';

            const filtered = allProperties.filter(p => p.category === currentCategory);

            if (!selectedProjectName) {
                tabSwitcher.classList.remove('hidden');
                backBtnText.innerText = "◀ กลับหน้าหลัก";
                headerTitle.innerText = "🏡 Estate (ระบบที่อยู่อาศัย)";

                if (filtered.length === 0) {
                    container.innerHTML = `<p class="text-center text-xs text-gray-400 py-10 bg-white/80 rounded-3xl border border-brand-100">ขณะนี้ยังไม่มีข้อมูลโครงการที่อยู่อาศัยในหมวดหมู่นี้</p>`;
                    return;
                }

                const projectsMap = {};
                filtered.forEach(p => {
                    if (!projectsMap[p.name]) {
                        projectsMap[p.name] = {
                            name: p.name,
                            image_url: p.image_url,
                            price_buy: p.price_buy,
                            price_rent: p.price_rent,
                            utilities_cost: p.utilities_cost,
                            units: []
                        };
                    }
                    projectsMap[p.name].units.push(p);
                });

                Object.values(projectsMap).forEach(proj => {
                    const card = document.createElement('div');
                    card.className = "bg-white/95 backdrop-blur-md p-4 rounded-3xl border border-brand-200 shadow-sm space-y-3 cursor-pointer hover:border-brand-400 transition";
                    card.onclick = () => {
                        selectedProjectName = proj.name;
                        renderContent();
                    };

                    card.innerHTML = `
                        <div class="flex space-x-3 items-center">
                            <img src="${proj.image_url || 'https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=300'}" class="w-24 h-24 rounded-2xl object-cover border border-brand-100 shrink-0">
                            <div class="flex-1 space-y-1">
                                <div class="flex justify-between items-start">
                                    <h3 class="font-bold text-sm text-brand-900">${proj.name}</h3>
                                    <span class="bg-brand-50 text-brand-700 text-[10px] font-bold px-2.5 py-0.5 rounded-full border border-brand-200">${proj.units.length} ยูนิต</span>
                                </div>
                                <p class="text-[11px] text-gray-500">ราคาซื้อเริ่มต้น: <span class="font-semibold text-brand-600">${parseFloat(proj.price_buy).toLocaleString()} Silver</span></p>
                                <p class="text-[11px] text-gray-500">ค่าเช่าเริ่มต้น: <span class="font-semibold text-brand-600">${parseFloat(proj.price_rent).toLocaleString()} Silver/สัปดาห์</span></p>
                                <p class="text-[11px] text-gray-500">ค่าน้ำ-ไฟ: <span class="font-semibold text-brand-600">${parseFloat(proj.utilities_cost).toLocaleString()} Silver/สัปดาห์</span></p>
                            </div>
                        </div>
                        <div class="pt-2 border-t border-brand-100 text-center">
                            <span class="text-xs font-bold text-brand-600 hover:text-brand-800">🔍 คลิกเพื่อดูรายการยูนิตห้องทั้งหมด ▶</span>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } else {
                tabSwitcher.classList.add('hidden');
                backBtnText.innerText = "◀ กลับหน้าโครงการ";
                headerTitle.innerText = `🏡 ${selectedProjectName}`;

                const projectUnits = filtered.filter(p => p.name === selectedProjectName);

                if (projectUnits.length === 0) {
                    container.innerHTML = `<p class="text-center text-xs text-gray-400 py-10 bg-white/80 rounded-3xl border border-brand-100">ไม่พบยูนิตในโครงการนี้</p>`;
                    return;
                }

                projectUnits.forEach(p => {
                    let owner = profilesMap[p.owner_id];
                    let isOwner = p.owner_id === currentUserId;
                    let statusText = p.owner_id ? `เจ้าของ: ${owner ? owner.name : 'ไม่ระบุ'} (${p.ownership_type === 'buy' ? 'ซื้อขาด' : 'เช่า'})` : 'สถานะ: ว่าง';

                    const card = document.createElement('div');
                    card.className = "bg-white/95 backdrop-blur-md p-4 rounded-3xl border border-brand-200 shadow-sm space-y-3";
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-xs text-brand-900">${p.name}</h3>
                                <p class="text-[10px] text-gray-500 mt-0.5">${statusText}</p>
                            </div>
                            <!-- แสดงรหัสห้องที่แอดมินกำหนดเอง เช่น BOT-01 -->
                            <span class="bg-brand-50 text-brand-700 text-[10px] font-bold px-2.5 py-0.5 rounded-full border border-brand-200">รหัสห้อง: ${p.room_code}</span>
                        </div>
                        <div class="text-[10px] text-gray-500 space-y-0.5">
                            <p>ราคาซื้อ: <span class="font-semibold text-brand-600">${parseFloat(p.price_buy).toLocaleString()} Silver</span> | ค่าเช่า: <span class="font-semibold text-brand-600">${parseFloat(p.price_rent).toLocaleString()} Silver/สัปดาห์</span></p>
                            <p>ค่าน้ำ-ไฟ: <span class="font-semibold text-brand-600">${parseFloat(p.utilities_cost).toLocaleString()} Silver/สัปดาห์</span></p>
                        </div>
                        <div class="flex space-x-2 pt-2 border-t border-brand-100">
                            ${!p.owner_id ? `
                                <button onclick="acquireProperty('${p.id}', 'rent', ${p.price_rent}, ${p.utilities_cost})" class="flex-1 bg-brand-100 hover:bg-brand-200 text-brand-700 font-bold text-xs py-2 rounded-xl transition">เช่า</button>
                                <button onclick="acquireProperty('${p.id}', 'buy', ${p.price_buy}, ${p.utilities_cost})" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs py-2 rounded-xl transition shadow-sm">ซื้อขาด</button>
                            ` : isOwner ? `
                                <button onclick="openInviteModal('${p.id}')" class="flex-1 bg-brand-100 hover:bg-brand-200 text-brand-700 font-bold text-xs py-2 rounded-xl transition">จัดการผู้อยู่อาศัย</button>
                                <button onclick="leaveProperty('${p.id}')" class="bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold text-xs px-4 py-2 rounded-xl transition">ยกเลิกสิทธิ์</button>
                            ` : `
                                <div class="w-full text-center text-[11px] text-gray-400 font-medium py-1.5 bg-gray-50 rounded-xl">มีผู้ครอบครองแล้ว</div>
                            `}
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        async function acquireProperty(propertyId, type, price, utilities) {
            // ตรวจสอบเงินในบัญชีธนาคารก่อนหักจริง
            let totalCost = type === 'buy' ? price : price; // ซื้อจ่ายราคาเต็ม เช่าจ่ายค่าเช่างวดแรก
            if (!activeBankAccount || Number(activeBankAccount.silver) < totalCost) {
                showModal("เงินไม่พอ!", `คุณมีเงินในบัญชีไม่เพียงพอสำหรับทำรายการนี้`, "💰");
                return;
            }

            let newSilver = Number(activeBankAccount.silver) - totalCost;

            // หักเงินจากบัญชีธนาคาร
            await supabaseClient.from('bank_accounts').update({ silver: newSilver }).eq('id', activeBankAccount.id);
            activeBankAccount.silver = newSilver;
            document.getElementById('user-silver-display').innerText = newSilver.toLocaleString() + ' Silver';

            // อัปเดตเจ้าของบ้านในตาราง properties
            const { error } = await supabaseClient.from('properties').update({
                owner_id: currentUserId,
                ownership_type: type
            }).eq('id', propertyId);

            if (error) {
                showModal("เกิดข้อผิดพลาด", error.message, "⚠️");
                return;
            }

            let billAmount = type === 'buy' ? utilities : (price + utilities);
            await supabaseClient.from('bills').insert([{
                property_id: propertyId,
                user_id: currentUserId,
                amount: billAmount,
                overdue_weeks: 0,
                status: 'unpaid'
            }]);

            showModal("ทำรายการสำเร็จ! 🏡", `คุณได้ทำการ${type === 'buy' ? 'ซื้อขาด' : 'เช่า'}ที่อยู่อาศัยเรียบร้อยแล้ว ระบบได้สร้างรายการบิลส่งไปยังแอป BillPay เรียบร้อย`, "🎉");
            await loadProperties();
        }

        async function leaveProperty(propertyId) {
            await supabaseClient.from('properties').update({
                owner_id: null,
                ownership_type: 'none'
            }).eq('id', propertyId);

            showModal("คืนสิทธิ์สำเร็จ", "คุณได้ยกเลิกการครอบครองที่อยู่อาศัยนี้แล้ว", "👋");
            await loadProperties();
        }

        function openInviteModal(propertyId) {
            managingPropertyId = propertyId;
            document.getElementById('invite-modal').classList.remove('hidden');
            renderResidents();
        }

        function closeInviteModal() {
            document.getElementById('invite-modal').classList.add('hidden');
            managingPropertyId = null;
        }

        async function renderResidents() {
            const listContainer = document.getElementById('residents-list');
            
            const { data: acceptedInvites } = await supabaseClient
                .from('property_invites')
                .select('*')
                .eq('property_id', managingPropertyId)
                .eq('status', 'accepted');

            let residentsHtml = `<div class="p-2 bg-brand-50 rounded-xl font-medium">👑 เจ้าของ (คุณเอง)</div>`;

            if (acceptedInvites && acceptedInvites.length > 0) {
                acceptedInvites.forEach(inv => {
                    let roommate = Object.values(profilesMap).find(p => p.custom_id === inv.target_custom_id);
                    let roommateName = roommate ? roommate.name : inv.target_custom_id;
                    residentsHtml += `<div class="p-2 bg-gray-50 rounded-xl flex justify-between items-center mt-1"><span>👤 รูมเมท: ${roommateName}</span></div>`;
                });
            }

            listContainer.innerHTML = residentsHtml;
        }

        async function sendInvite() {
            let targetCustomId = document.getElementById('invite-user-custom-id').value.trim();
            if (!targetCustomId) {
                showModal("กรุณากรอก ID", "โปรดใส่ ID ผู้เล่นของเพื่อนที่ต้องการชวน", "⚠️");
                return;
            }

            let targetUser = Object.values(profilesMap).find(p => p.custom_id === targetCustomId);
            if (!targetUser) {
                showModal("ไม่พบผู้เล่น", `ไม่พบผู้เล่นที่มี ID: ${targetCustomId} ในระบบ`, "❌");
                return;
            }

            if (targetUser.id === currentUserId) {
                showModal("ไม่สามารถชวนตัวเองได้", "คุณไม่สามารถส่งคำเชิญหาตัวเองได้ครับ", "⚠️");
                return;
            }

            const { error } = await supabaseClient.from('property_invites').insert([{
                property_id: managingPropertyId,
                inviter_id: currentUserId,
                target_custom_id: targetCustomId,
                status: 'pending'
            }]);

            if (error) {
                showModal("เกิดข้อผิดพลาด", error.message, "❌");
                return;
            }

            showModal("ส่งคำเชิญสำเร็จ!", `ส่งคำเชิญไปยังผู้เล่น ID: ${targetCustomId} เรียบร้อยแล้ว`, "💌");
            document.getElementById('invite-user-custom-id').value = '';
            closeInviteModal();
        }
    </script>
</body>
</html>
