<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Log - คลังเก็บของ (Inventory)</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e11d48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#4c0519',
                        }
                    },
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #fff5f5 0%, #ffe4e6 100%); color: #4c0519; min-height: 100vh; }
    </style>
</head>
<body class="flex flex-col items-center justify-start p-4 md:p-8">

    <!-- Main Container (ไร้กรอบขาวใหญ่ เพื่อความโปร่งโล่งสบายตา) -->
    <div class="w-full max-w-2xl space-y-6">
        
        <!-- Header Nav -->
        <div class="border-b border-brand-200 pb-4 mb-2 flex items-center justify-between">
            <div>
                <button onclick="location.href='home.html'" class="inline-flex items-center space-x-1 text-xs font-bold text-brand-600 hover:text-brand-800 transition mb-2">
                    <span>◀ กลับหน้าหลัก</span>
                </button>
                <h1 class="text-xl font-extrabold text-brand-900">🎒 คลังเก็บของ (Inventory)</h1>
            </div>
            <div class="text-right bg-white/80 px-3 py-2 rounded-2xl border border-brand-200 shadow-sm">
                <span class="text-[10px] text-gray-500 block">เงินในบัญชีปัจจุบัน</span>
                <span id="user-silver-display" class="text-xs font-extrabold text-brand-600">0 Silver</span>
            </div>
        </div>

        <!-- Section: รายการไอเท็มในคลัง -->
        <div class="space-y-4">
            <h3 class="text-xs font-bold text-brand-800 px-1">ไอเท็มทั้งหมดของคุณ</h3>
            <div id="inventory-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <!-- โหลดรายการไอเท็มจาก Supabase ผ่าน JS -->
            </div>
        </div>

    </div>

    <!-- Modal ส่งไอเท็มให้เพื่อน -->
    <div id="send-item-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-brand-200 max-w-sm w-full p-6 text-center transform transition-all scale-95 opacity-0 duration-200" id="send-modal-box">
            <div class="w-16 h-16 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner">🎁</div>
            <h3 class="text-base font-bold text-brand-900 mb-1">ส่งไอเท็มให้เพื่อน</h3>
            <p id="send-item-title" class="text-xs text-gray-500 mb-4">ส่งไอเท็ม...</p>
            
            <div class="space-y-3 text-left mb-5">
                <div>
                    <label class="block text-[11px] font-semibold text-brand-800 mb-1">เลขบัญชีผู้รับ หรือ ID 8 หลัก</label>
                    <input type="text" id="recipient-input" placeholder="กรอกเลขบัญชี 10 หลัก หรือ ID" class="w-full px-3 py-2.5 rounded-xl border border-brand-200 text-xs bg-white focus:outline-none focus:border-brand-500 shadow-inner">
                </div>
            </div>

            <div class="flex space-x-2">
                <button onclick="closeSendModal()" class="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-300 transition">ยกเลิก</button>
                <button onclick="executeSendItem()" class="flex-1 bg-brand-600 text-white py-2.5 rounded-xl text-xs font-semibold hover:bg-brand-700 transition shadow-md">ยืนยันการส่ง</button>
            </div>
        </div>
    </div>

    <!-- Custom Modal ทั่วไป -->
    <div id="custom-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-brand-200 max-w-sm w-full p-6 text-center transform transition-all scale-95 opacity-0 duration-200" id="modal-box">
            <div id="modal-icon" class="w-16 h-16 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">✨</div>
            <h3 id="modal-title" class="text-lg font-bold text-brand-900 mb-2">แจ้งเตือนระบบ</h3>
            <p id="modal-message" class="text-sm text-gray-600 mb-6">ข้อความแจ้งเตือน...</p>
            <button onclick="closeModal()" class="bg-brand-600 text-white px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-brand-700 transition w-full shadow-md">ตกลง</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://alyifbjuugctlqiwcrny.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_79rKUSpeFSZbPtUpEPtiEw_t_saz9Hk';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        let currentUserId = null;
        let userProfile = null;
        let activeBankAccount = null;
        let selectedInventoryItem = null;

        function showModal(title, message, icon = '✨') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUserId = session.user.id;

            await loadUserData();
            await loadActiveAccount();
            await loadInventory();
        });

        async function loadUserData() {
            const { data } = await supabaseClient.from('profiles').select('*').eq('id', currentUserId).single();
            if (data) userProfile = data;
        }

        async function loadActiveAccount() {
            const activeAccNo = sessionStorage.getItem('active_bank_acc');
            let query = supabaseClient.from('bank_accounts').select('*').eq('user_id', currentUserId);
            if (activeAccNo) query = query.eq('account_number', activeAccNo);

            const { data } = await query.limit(1);
            if (data && data.length > 0) {
                activeBankAccount = data[0];
                document.getElementById('user-silver-display').innerText = Number(activeBankAccount.silver).toLocaleString() + ' Silver';
            } else {
                const { data: fallback } = await supabaseClient.from('bank_accounts').select('*').eq('user_id', currentUserId).order('created_at', { ascending: true }).limit(1);
                if (fallback && fallback.length > 0) {
                    activeBankAccount = fallback[0];
                    document.getElementById('user-silver-display').innerText = Number(activeBankAccount.silver).toLocaleString() + ' Silver';
                } else {
                    document.getElementById('user-silver-display').innerText = '0 Silver';
                }
            }
        }

        async function loadInventory() {
            // ดึงข้อมูลคลังสินค้า พร้อม JOIN ไปเอาข้อมูลสินค้าจาก store_items
            const { data: inventory } = await supabaseClient
                .from('inventories')
                .select('id, quantity, store_items (id, name, image_url, effect_type, effect_value)')
                .eq('user_id', currentUserId);

            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = '';

            if (!inventory || inventory.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-xs text-gray-400 py-8 bg-white/80 rounded-3xl border border-brand-100">คลังเก็บของว่างเปล่า (สามารถซื้อสินค้าได้ที่แอป Store)</p>';
                return;
            }

            inventory.forEach(inv => {
                const item = inv.store_items;
                if (!item) return;

                const card = document.createElement('div');
                card.className = "bg-white/90 backdrop-blur-md p-4 rounded-3xl border border-brand-200 shadow-sm flex items-center justify-between gap-3";
                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="relative">
                            <img src="${item.image_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=150'}" class="w-14 h-14 object-cover rounded-2xl shadow-inner border border-brand-100">
                            <span class="absolute -top-1.5 -right-1.5 bg-brand-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">x${inv.quantity}</span>
                        </div>
                        <div>
                            <h4 class="font-bold text-xs text-brand-900">${item.name}</h4>
                            <p class="text-[11px] text-gray-500 mt-0.5">
                                ${item.effect_type === 'energy' ? `⚡ พลังงาน +${item.effect_value}` : `🍲 อาหาร +${item.effect_value}`}
                            </p>
                        </div>
                    </div>
                    <div class="flex flex-col space-y-1.5">
                        <button onclick="useItem('${inv.id}', '${item.effect_type}', ${item.effect_value}, '${item.name}', ${inv.quantity})" class="bg-brand-600 hover:bg-brand-700 text-white text-[10px] font-bold px-3 py-1.5 rounded-xl transition shadow-sm whitespace-nowrap">
                            กิน / ใช้
                        </button>
                        <button onclick="openSendModal('${inv.id}', '${item.name}')" class="bg-gray-100 hover:bg-gray-200 text-brand-800 text-[10px] font-semibold px-3 py-1 rounded-xl transition whitespace-nowrap">
                            ส่งให้เพื่อน
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function useItem(invId, effectType, effectValue, itemName, currentQty) {
            await loadUserData(); // โหลดข้อมูลสถานะล่าสุด

            const isEnergy = effectType === 'energy';
            const currentVal = isEnergy ? userProfile.energy : userProfile.food;
            const maxVal = isEnergy ? userProfile.max_energy : userProfile.max_food;

            // ตรวจสอบว่าหลอดเต็ม 100% (หรือเต็ม MAX) แล้วหรือยัง
            if (currentVal >= maxVal) {
                showModal("ไม่สามารถใช้ได้", `${isEnergy ? 'หลอดพลังงาน' : 'หลอดอาหาร'}ของคุณเต็มแล้ว (100%) ไม่สามารถกินเพิ่มได้อีก`, "⚠️");
                return;
            }

            // คำนวณค่าใหม่ไม่ให้เกิน MAX
            const newVal = Math.min(currentVal + effectValue, maxVal);
            const updatePayload = isEnergy ? { energy: newVal } : { food: newVal };

            // อัปเดตค่าพลังงาน/อาหารในตาราง profiles
            await supabaseClient.from('profiles').update(updatePayload).eq('id', currentUserId);

            // ลดจำนวนไอเท็มใน inventory ลง 1 ชิ้น (ถ้าหมดให้ลบแถวออก)
            if (currentQty > 1) {
                await supabaseClient.from('inventories').update({ quantity: currentQty - 1 }).eq('id', invId);
            } else {
                await supabaseClient.from('inventories').delete().eq('id', invId);
            }

            await loadInventory();
            showModal("ใช้งานสำเร็จ!", `ทาน "${itemName}" เรียบร้อยแล้ว (${isEnergy ? 'พลังงาน' : 'อาหาร'} +${effectValue})`, "🎉");
        }

        function openSendModal(invId, itemName) {
            selectedInventoryItem = invId;
            document.getElementById('send-item-title').innerText = `ไอเท็ม: ${itemName} (ส่งครั้งละ 1 ชิ้น)`;
            document.getElementById('recipient-input').value = '';
            
            const modal = document.getElementById('send-item-modal');
            const box = document.getElementById('send-modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
        }

        function closeSendModal() {
            const modal = document.getElementById('send-item-modal');
            const box = document.getElementById('send-modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); selectedInventoryItem = null; }, 200);
        }

        async function executeSendItem() {
            const recipientKey = document.getElementById('recipient-input').value.trim();
            if (!recipientKey) {
                showModal("ข้อมูลไม่ครบ", "กรุณากรอกเลขบัญชีหรือ ID ผู้รับให้ถูกต้อง", "⚠️");
                return;
            }

            showModal("กำลังส่ง...", "กำลังตรวจสอบและส่งไอเท็มให้เพื่อน...", "⏳");

            // ค้นหาผู้รับจากเลขบัญชีธนาคาร หรือ custom_id ของโปรไฟล์
            let targetUserId = null;

            const { data: bankTarget } = await supabaseClient.from('bank_accounts').select('user_id').eq('account_number', recipientKey).limit(1);
            if (bankTarget && bankTarget.length > 0) {
                targetUserId = bankTarget[0].user_id;
            } else {
                const { data: profileTarget } = await supabaseClient.from('profiles').select('id').eq('custom_id', recipientKey).limit(1);
                if (profileTarget && profileTarget.length > 0) {
                    targetUserId = profileTarget[0].id;
                }
            }

            if (!targetUserId) {
                closeModal();
                showModal("ไม่พบผู้รับ", "ไม่พบเลขบัญชีหรือ ID ผู้รับนี้ในระบบ", "❌");
                return;
            }

            if (targetUserId === currentUserId) {
                closeModal();
                showModal("ไม่สามารถส่งได้", "ไม่สามารถส่งไอเท็มให้ตัวเองได้", "⚠️");
                return;
            }

            // ดึงข้อมูลไอเท็มของเราที่จะส่ง
            const { data: myInv } = await supabaseClient.from('inventories').select('*').eq('id', selectedInventoryItem).single();
            if (!myInv) {
                closeModal();
                showModal("ข้อผิดพลาด", "ไม่พบไอเท็มนี้ในคลังของคุณ", "❌");
                return;
            }

            // ลดจำนวนของเราลง 1 ชิ้น หรือลบออกถ้าหมด
            if (myInv.quantity > 1) {
                await supabaseClient.from('inventories').update({ quantity: myInv.quantity - 1 }).eq('id', myInv.id);
            } else {
                await supabaseClient.from('inventories').delete().eq('id', myInv.id);
            }

            // ตรวจสอบว่าผู้รับมีไอเท็มชนิดนี้อยู่แล้วหรือไม่ ถ้ามีให้บวกจำนวนเพิ่ม ถ้าไม่มีให้สร้างใหม่
            const { data: targetInv } = await supabaseClient.from('inventories').select('*').eq('user_id', targetUserId).eq('item_id', myInv.item_id).limit(1);

            if (targetInv && targetInv.length > 0) {
                await supabaseClient.from('inventories').update({ quantity: targetInv[0].quantity + 1 }).eq('id', targetInv[0].id);
            } else {
                await supabaseClient.from('inventories').insert([{
                    user_id: targetUserId,
                    item_id: myInv.item_id,
                    quantity: 1
                }]);
            }

            closeSendModal();
            await loadInventory();
            showModal("ส่งไอเท็มสำเร็จ!", "ส่งของให้เพื่อนเรียบร้อยแล้ว!", "🎁");
        }
    </script>
</body>
</html>
