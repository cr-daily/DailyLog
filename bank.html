<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Log - ธนาคารส่วนตัว (Bank)</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e11d48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#4c0519',
                        }
                    },
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #fff5f5 0%, #ffe4e6 100%); color: #4c0519; min-height: 100vh; }
    </style>
</head>
<body class="flex flex-col items-center justify-start p-4 md:p-8">

    <!-- Main Container -->
    <div class="w-full max-w-2xl bg-white/90 backdrop-blur-md shadow-2xl rounded-3xl p-6 md:p-8 border border-brand-200">
        
        <!-- Header Nav -->
        <div class="flex items-center justify-between border-b border-brand-100 pb-4 mb-6">
            <button onclick="location.href='home.html'" class="flex items-center space-x-1 text-xs font-bold text-brand-600 hover:text-brand-800 transition">
                <span>◀ กลับหน้าหลัก</span>
            </button>
            <h1 class="text-lg font-extrabold text-brand-900">💳 ธนาคารส่วนตัว (Bank)</h1>
            <div class="w-12"></div>
        </div>

        <!-- Section 1: บัญชีธนาคารของผู้ใช้ (สูงสุด 3 บัญชี) -->
        <div class="mb-8">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xs font-bold text-brand-800">บัญชีของฉัน (<span id="acc-count">0</span>/3)</h3>
                <button id="btn-add-acc" onclick="createNewAccount()" class="bg-brand-600 hover:bg-brand-700 text-white text-[11px] font-bold px-3 py-1.5 rounded-xl transition shadow-sm">
                    + สร้างบัญชีใหม่
                </button>
            </div>
            <div id="accounts-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- โหลดการ์ดบัญชีจาก JS -->
            </div>
        </div>

        <!-- Section 2: Tab Switcher (โอนเงิน / รายชื่อเมม) -->
        <div class="flex bg-brand-100/60 p-1.5 rounded-2xl mb-6">
            <button id="tab-btn-transfer" onclick="switchBankTab('transfer')" class="flex-1 py-2 rounded-xl text-xs font-bold bg-brand-600 text-white shadow-md transition">โอนเงิน (Transfer)</button>
            <button id="tab-btn-contacts" onclick="switchBankTab('contacts')" class="flex-1 py-2 rounded-xl text-xs font-medium text-brand-800 hover:text-brand-600 transition">รายชื่อโปรด (Contacts)</button>
        </div>

        <!-- View 1: ฟอร์มโอนเงิน -->
        <div id="view-transfer" class="space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-brand-100 space-y-3">
                <div>
                    <label class="block text-[11px] font-semibold text-brand-800 mb-1">เลขบัญชีผู้รับเงิน (10 หลัก)</label>
                    <input type="text" id="transfer-rec-acc" maxlength="10" class="w-full px-3 py-2.5 rounded-xl border border-brand-200 text-xs bg-white focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-brand-800 mb-1">จำนวนเงิน (Silver)</label>
                    <input type="number" id="transfer-amount" class="w-full px-3 py-2.5 rounded-xl border border-brand-200 text-xs bg-white focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-brand-800 mb-1">หมายเหตุ (ไม่ระบูก็ได้)</label>
                    <input type="text" id="transfer-note" class="w-full px-3 py-2.5 rounded-xl border border-brand-200 text-xs bg-white focus:outline-none focus:border-brand-500">
                </div>
                <button onclick="executeTransfer()" class="w-full bg-gradient-to-r from-brand-600 to-brand-500 text-white py-3 rounded-xl font-bold shadow-md hover:from-brand-700 hover:to-brand-600 transition text-xs mt-2">
                    ยืนยันการโอนเงิน
                </button>
            </div>
        </div>

        <!-- View 2: รายชื่อบันทึกโปรด -->
        <div id="view-contacts" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-brand-100 space-y-3">
                <h4 class="text-xs font-bold text-brand-900">เพิ่มรายชื่อใหม่</h4>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <input type="text" id="contact-name-input" placeholder="ชื่อเรียก (จำง่าย)" class="px-3 py-2 rounded-xl border border-brand-200 text-xs bg-white">
                    <input type="text" id="contact-acc-input" maxlength="10" placeholder="เลขบัญชี 10 หลัก" class="px-3 py-2 rounded-xl border border-brand-200 text-xs bg-white">
                </div>
                <button onclick="addContact()" class="w-full bg-brand-600 text-white py-2 rounded-xl text-xs font-bold hover:bg-brand-700 transition">
                    + บันทึกรายชื่อ
                </button>
            </div>

            <div class="space-y-2">
                <h4 class="text-xs font-bold text-brand-800">รายชื่อที่บันทึกไว้</h4>
                <div id="contacts-list" class="space-y-2">
                    <!-- โหลดรายชื่อจาก JS -->
                </div>
            </div>
        </div>

    </div>

    <!-- Modal Popup / สลิปโอนเงิน -->
    <div id="custom-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-brand-200 max-w-sm w-full p-6 text-center transform transition-all scale-95 opacity-0 duration-200" id="modal-box">
            <div id="modal-icon" class="w-16 h-16 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">✨</div>
            <h3 id="modal-title" class="text-lg font-bold text-brand-900 mb-2">แจ้งเตือนระบบ</h3>
            <div id="modal-message" class="text-sm text-gray-600 mb-6">ข้อความแจ้งเตือน...</div>
            <button onclick="closeModal()" class="bg-brand-600 text-white px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-brand-700 transition w-full shadow-md">ตกลง</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://alyifbjuugctlqiwcrny.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_79rKUSpeFSZbPtUpEPtiEw_t_saz9Hk';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        let currentUserId = null;
        let myAccounts = [];
        let selectedAccNo = null;

        function showModal(title, messageHtml, icon = '✨') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerHTML = messageHtml;
            document.getElementById('modal-icon').innerText = icon;
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUserId = session.user.id;

            await loadAccounts();
            await loadContacts();
        });

        async function loadAccounts() {
            const { data } = await supabaseClient.from('bank_accounts').select('*').eq('user_id', currentUserId).order('created_at', { ascending: true });
            myAccounts = data || [];

            document.getElementById('acc-count').innerText = myAccounts.length;
            const btnAdd = document.getElementById('btn-add-acc');
            if (myAccounts.length >= 3) btnAdd.classList.add('hidden');
            else btnAdd.classList.remove('hidden');

            if (myAccounts.length > 0 && !selectedAccNo) {
                selectedAccNo = myAccounts[0].account_number;
            }

            renderAccountsUI();
        }

        function renderAccountsUI() {
            const container = document.getElementById('accounts-list');
            container.innerHTML = '';

            myAccounts.forEach(acc => {
                const isSelected = acc.account_number === selectedAccNo;
                const card = document.createElement('div');
                card.className = `p-4 rounded-2xl border transition cursor-pointer relative ${isSelected ? 'bg-gradient-to-br from-brand-600 to-brand-800 text-white border-brand-600 shadow-lg' : 'bg-white text-brand-900 border-brand-200 hover:border-brand-400'}`;
                
                card.onclick = () => {
                    selectedAccNo = acc.account_number;
                    renderAccountsUI();
                };

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <input type="text" value="${acc.account_name}" onchange="renameAccount('${acc.id}', this.value)" onclick="event.stopPropagation()" class="bg-transparent font-bold text-xs focus:outline-none border-b border-dashed border-current max-w-[120px]">
                        ${myAccounts.length > 1 ? `<button onclick="deleteAccount('${acc.id}', event)" class="text-[10px] bg-red-500/20 text-red-500 hover:bg-red-500 hover:text-white px-2 py-0.5 rounded-lg transition">ลบ</button>` : ''}
                    </div>
                    <p class="text-[10px] opacity-80 tracking-wider">เลขบัญชี: ${acc.account_number}</p>
                    <p class="text-base font-extrabold mt-2">${Number(acc.silver).toLocaleString()} <span class="text-xs font-normal">Silver</span></p>
                    ${isSelected ? `<span class="absolute bottom-2 right-2 text-[9px] bg-white/20 px-2 py-0.5 rounded-full">ใช้งานอยู่</span>` : ''}
                `;
                container.appendChild(card);
            });
        }

        async function createNewAccount() {
            if (myAccounts.length >= 3) return;

            const newAccNo = Math.floor(1000000000 + Math.random() * 9000000000).toString();
            const newAccName = `บัญชีที่ ${myAccounts.length + 1}`;

            const { error } = await supabaseClient.from('bank_accounts').insert([{
                user_id: currentUserId,
                account_name: newAccName,
                account_number: newAccNo,
                silver: 1000.00
            }]);

            if (!error) {
                showModal("สำเร็จ", "เปิดบัญชีธนาคารใหม่เรียบร้อยแล้ว!", "🎉");
                await loadAccounts();
            } else {
                showModal("ข้อผิดพลาด", error.message, "❌");
            }
        }

        async function renameAccount(accId, newName) {
            if (!newName.trim()) return;
            await supabaseClient.from('bank_accounts').update({ account_name: newName.trim() }).eq('id', accId);
            await loadAccounts();
        }

        async function deleteAccount(accId, e) {
            e.stopPropagation();
            if (myAccounts.length <= 1) return;

            const { error } = await supabaseClient.from('bank_accounts').delete().eq('id', accId);
            if (!error) {
                showModal("ลบบัญชีแล้ว", "ทำการลบบัญชีธนาคารสำเร็จ", "🗑️");
                selectedAccNo = null;
                await loadAccounts();
            }
        }

        function switchBankTab(tab) {
            const btnTransfer = document.getElementById('tab-btn-transfer');
            const btnContacts = document.getElementById('tab-btn-contacts');
            const viewTransfer = document.getElementById('view-transfer');
            const viewContacts = document.getElementById('view-contacts');

            if (tab === 'transfer') {
                btnTransfer.className = "flex-1 py-2 rounded-xl text-xs font-bold bg-brand-600 text-white shadow-md transition";
                btnContacts.className = "flex-1 py-2 rounded-xl text-xs font-medium text-brand-800 hover:text-brand-600 transition";
                viewTransfer.classList.remove('hidden');
                viewContacts.classList.add('hidden');
            } else {
                btnContacts.className = "flex-1 py-2 rounded-xl text-xs font-bold bg-brand-600 text-white shadow-md transition";
                btnTransfer.className = "flex-1 py-2 rounded-xl text-xs font-medium text-brand-800 hover:text-brand-600 transition";
                viewContacts.classList.remove('hidden');
                viewTransfer.classList.add('hidden');
            }
        }

        async function executeTransfer() {
            const recAcc = document.getElementById('transfer-rec-acc').value.trim();
            const amount = parseFloat(document.getElementById('transfer-amount').value);
            const note = document.getElementById('transfer-note').value.trim();

            if (!selectedAccNo) { showModal("แจ้งเตือน", "กรุณาเลือกบัญชีผู้โอนก่อนครับ", "⚠️"); return; }
            if (!recAcc || recAcc.length !== 10) { showModal("ข้อมูลไม่ถูกต้อง", "กรุณากรอกเลขบัญชีปลายทาง 10 หลัก", "⚠️"); return; }
            if (isNaN(amount) || amount <= 0) { showModal("ข้อมูลไม่ถูกต้อง", "กรุณากรอกจำนวนเงินให้ถูกต้อง", "⚠️"); return; }

            showModal("กำลังโอนเงิน...", "โปรดรอสักครู่ ระบบกำลังทำรายการธุรกรรม", "⏳");

            const { data, error } = await supabaseClient.rpc('transfer_silver', {
                sender_account_no: selectedAccNo,
                receiver_account_no: recAcc,
                transfer_amount: amount,
                transfer_note: note
            });

            closeModal();

            if (error) {
                showModal("โอนเงินไม่สำเร็จ", error.message, "❌");
                return;
            }

            const { data: recData } = await supabaseClient.from('bank_accounts').select('account_name, profiles(name)').eq('account_number', recAcc).single();
            const senderAcc = myAccounts.find(a => a.account_number === selectedAccNo);

            const now = new Date();
            const dateStr = now.toLocaleDateString('th-TH') + ' ' + now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

            const slipHtml = `
                <div class="bg-brand-50 p-4 rounded-2xl border border-brand-200 text-left text-xs space-y-2 mt-2">
                    <p class="text-center font-bold text-brand-900 border-b pb-2 mb-2">🧾 สลิปการโอนเงินสำเร็จ</p>
                    <p><b>วันที่/เวลา:</b> ${dateStr}</p>
                    <p><b>ผู้โอน:</b> ${senderAcc ? senderAcc.account_name : 'บัญชีฉัน'} (${selectedAccNo})</p>
                    <p><b>ผู้รับ:</b> ${recData ? recData.profiles.name : 'บัญชีปลายทาง'} (${recAcc})</p>
                    <p class="text-brand-600 font-extrabold text-sm py-1"><b>จำนวนเงิน:</b> ${amount.toLocaleString()} Silver</p>
                    <p><b>หมายเหตุ:</b> ${note || '-'}</p>
                </div>
            `;

            showModal("โอนเงินสำเร็จ!", slipHtml, "✅");
            document.getElementById('transfer-amount').value = '';
            document.getElementById('transfer-note').value = '';
            document.getElementById('transfer-rec-acc').value = '';
            await loadAccounts();
        }

        async function loadContacts() {
            const { data } = await supabaseClient.from('bank_contacts').select('*').eq('user_id', currentUserId);
            const container = document.getElementById('contacts-list');
            container.innerHTML = '';

            if (!data || data.length === 0) {
                container.innerHTML = '<p class="text-[11px] text-gray-400 text-center py-2">ยังไม่มีรายชื่อที่บันทึกไว้</p>';
                return;
            }

            data.forEach(c => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center p-3 bg-white rounded-xl border border-brand-100 shadow-sm";
                item.innerHTML = `
                    <div>
                        <h5 class="font-bold text-xs text-brand-900">${c.contact_name}</h5>
                        <p class="text-[10px] text-gray-500">${c.account_number}</p>
                    </div>
                    <div class="flex space-x-2">
                        <button onclick="quickTransfer('${c.account_number}')" class="bg-brand-600 text-white text-[10px] font-bold px-3 py-1 rounded-lg hover:bg-brand-700">โอนเงิน</button>
                        <button onclick="deleteContact('${c.id}')" class="text-[10px] text-red-500 px-2 py-1">ลบ</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        async function addContact() {
            const name = document.getElementById('contact-name-input').value.trim();
            const acc = document.getElementById('contact-acc-input').value.trim();

            if (!name || !acc || acc.length !== 10) {
                showModal("ข้อมูลไม่ครบ", "กรุณากรอกชื่อและเลขบัญชี 10 หลักให้ถูกต้อง", "⚠️");
                return;
            }

            await supabaseClient.from('bank_contacts').insert([{ user_id: currentUserId, contact_name: name, account_number: acc }]);
            document.getElementById('contact-name-input').value = '';
            document.getElementById('contact-acc-input').value = '';
            await loadContacts();
            showModal("บันทึกสำเร็จ", "เพิ่มรายชื่อใหม่เรียบร้อยแล้ว!", "✨");
        }

        async function deleteContact(id) {
            await supabaseClient.from('bank_contacts').delete().eq('id', id);
            await loadContacts();
        }

        function quickTransfer(accNo) {
            switchBankTab('transfer');
            document.getElementById('transfer-rec-acc').value = accNo;
        }
    </script>
</body>
</html>
