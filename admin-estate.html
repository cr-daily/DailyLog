<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Log - Admin Estate Management</title>
    
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e11d48">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="https://res.cloudinary.com/dp6k1rwj/image/upload/v1794345597/wmremove-transformed.jpg">

    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- เรียกใช้ไฟล์ตั้งค่า Cloudinary -->
    <script src="cloudinary-config.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2', 100: '#ffe4e6', 200: '#fecdd3', 300: '#fda4af',
                            400: '#fb7185', 500: '#f43f5e', 600: '#e11d48', 700: '#be123c',
                            800: '#9f1239', 900: '#4c0519',
                        }
                    },
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #fff5f5 0%, #ffe4e6 100%); color: #4c0519; min-height: 100vh; }</style>
</head>
<body class="flex flex-col items-center justify-start p-4 md:p-8 pb-20">

    <div class="w-full max-w-2xl space-y-4">
        
        <!-- Header Nav -->
        <div class="border-b border-brand-200 pb-3 flex items-center justify-between">
            <div class="space-y-0.5">
                <button onclick="location.href='admin.html'" class="inline-flex items-center space-x-1 text-xs font-bold text-brand-600 hover:text-brand-800 transition">
                    <span>◀ กลับหน้าแดชบอร์ด</span>
                </button>
                <h1 class="text-base sm:text-lg font-extrabold text-brand-950">🏡 จัดการ Estate (ที่อยู่อาศัย)</h1>
            </div>
            <span class="bg-brand-600 text-white text-[9px] font-bold px-2.5 py-1 rounded-full shadow-sm">ADMIN</span>
        </div>

        <!-- ฟอร์มสร้างโครงการที่อยู่อาศัย -->
        <div class="bg-white/95 backdrop-blur-md p-4 sm:p-5 rounded-3xl border border-brand-200 shadow-sm space-y-3.5">
            <h2 class="text-xs sm:text-sm font-bold text-brand-950">➕ สร้างโครงการที่อยู่อาศัยใหม่</h2>
            <div class="space-y-3">
                
                <!-- เลือกประเภทที่อยู่อาศัย -->
                <div>
                    <label class="text-[11px] font-bold text-gray-700">ประเภทที่อยู่อาศัย</label>
                    <div class="grid grid-cols-3 gap-2 mt-1">
                        <button type="button" id="category-house-btn" onclick="selectCategory('house')" class="py-2.5 px-2 rounded-2xl text-xs font-bold bg-brand-600 text-white shadow-sm transition flex items-center justify-center space-x-1">
                            <span>🏠 บ้าน</span>
                        </button>
                        <button type="button" id="category-condo-btn" onclick="selectCategory('condo')" class="py-2.5 px-2 rounded-2xl text-xs font-medium bg-brand-50 text-brand-800 border border-brand-200 hover:bg-brand-100 transition flex items-center justify-center space-x-1">
                            <span>🏢 คอนโด</span>
                        </button>
                        <button type="button" id="category-apartment-btn" onclick="selectCategory('apartment')" class="py-2.5 px-2 rounded-2xl text-xs font-medium bg-brand-50 text-brand-800 border border-brand-200 hover:bg-brand-100 transition flex items-center justify-center space-x-1">
                            <span>🏨 อพาร์ตเมนต์</span>
                        </button>
                    </div>
                </div>

                <div>
                    <label id="name-label" class="text-[11px] font-bold text-gray-700">ชื่อโครงการบ้านจัดสรร</label>
                    <input type="text" id="estate-name" placeholder="เช่น โครงการบ้านเดี่ยว The Botanica" class="w-full px-4 py-2.5 rounded-xl border border-brand-200 text-xs focus:outline-none focus:border-brand-500">
                </div>

                <!-- อัปโหลดรูปภาพ 1:1 ผ่าน Cloudinary -->
                <div id="image-upload-box">
                    <label class="text-[11px] font-bold text-gray-700">รูปภาพโครงการ (ขนาด 1:1)</label>
                    <div class="flex items-center space-x-3 mt-1">
                        <label class="cursor-pointer bg-brand-50 hover:bg-brand-100 text-brand-700 border border-brand-200 font-bold text-xs px-4 py-2.5 rounded-xl transition shadow-sm inline-flex items-center space-x-1">
                            <span>📁 เลือกรูปภาพ</span>
                            <input type="file" id="estate-image-file" accept="image/*" class="hidden" onchange="previewImage(event)">
                        </label>
                        <span id="file-name-display" class="text-[11px] text-gray-400 truncate">ยังไม่ได้เลือกไฟล์</span>
                    </div>
                    <div id="image-preview-container" class="mt-2 hidden">
                        <img id="image-preview" class="w-16 h-16 rounded-xl object-cover border border-brand-200 shadow-sm">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[11px] font-bold text-gray-700">ราคาซื้อขาด (Silver)</label>
                        <input type="number" id="estate-price-buy" placeholder="500000" class="w-full px-4 py-2.5 rounded-xl border border-brand-200 text-xs focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-gray-700">ค่าเช่าต่อสัปดาห์ (Silver)</label>
                        <input type="number" id="estate-price-rent" placeholder="15000" class="w-full px-4 py-2.5 rounded-xl border border-brand-200 text-xs focus:outline-none focus:border-brand-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[11px] font-bold text-gray-700">ค่าน้ำ-ไฟ (ต่อสัปดาห์)</label>
                        <input type="number" id="estate-utilities" placeholder="2500" class="w-full px-4 py-2.5 rounded-xl border border-brand-200 text-xs focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label id="count-label" class="text-[11px] font-bold text-gray-700">จำนวนหลังที่ต้องการสร้าง (สูงสุด 15)</label>
                        <input type="number" id="estate-count" placeholder="5" min="1" max="15" value="5" class="w-full px-4 py-2.5 rounded-xl border border-brand-200 text-xs focus:outline-none focus:border-brand-500">
                    </div>
                </div>

                <button onclick="createEstateProject()" id="submit-btn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs py-3 rounded-xl transition shadow-md">
                    สร้างโครงการที่อยู่อาศัย (Create Estate)
                </button>
            </div>
        </div>

        <!-- รายการที่อยู่อาศัยทั้งหมดในระบบ -->
        <div class="bg-white/90 backdrop-blur-md p-4 sm:p-5 rounded-3xl border border-brand-200 shadow-sm space-y-3">
            <h2 class="text-xs sm:text-sm font-bold text-brand-950">📋 รายชื่อที่อยู่อาศัยในระบบปัจจุบัน</h2>
            <div id="estates-catalog-container" class="space-y-3">
                <p class="text-center text-xs text-gray-400 py-6">กำลังโหลดข้อมูลที่อยู่อาศัย...</p>
            </div>
        </div>

    </div>

    <!-- Modal แจ้งเตือนป๊อปอัพน่ารักๆ -->
    <div id="custom-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-brand-200 max-w-sm w-full p-6 text-center transform transition-all scale-95 opacity-0 duration-200" id="modal-box">
            <div id="modal-icon" class="w-16 h-16 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">✨</div>
            <h3 id="modal-title" class="text-lg font-bold text-brand-900 mb-2">แจ้งเตือนระบบ</h3>
            <p id="modal-message" class="text-sm text-gray-600 mb-6">ข้อความแจ้งเตือน...</p>
            <button onclick="closeModal()" class="bg-brand-600 text-white px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-brand-700 transition w-full shadow-md">ตกลง</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://alyifbjuugctlqiwcrny.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_79rKUSpeFSZbPtUpEPtiEw_t_saz9Hk';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        let selectedCategory = 'house';
        let selectedFile = null;

        function showModal(title, message, icon = '✨', cb = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
            window.modalCallback = cb;
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); if(window.modalCallback) window.modalCallback(); }, 200);
        }

        function selectCategory(category) {
            selectedCategory = category;
            const houseBtn = document.getElementById('category-house-btn');
            const condoBtn = document.getElementById('category-condo-btn');
            const aptBtn = document.getElementById('category-apartment-btn');
            const nameLabel = document.getElementById('name-label');
            const countInput = document.getElementById('estate-count');
            const countLabel = document.getElementById('count-label');

            houseBtn.className = "py-2.5 px-2 rounded-2xl text-xs font-medium bg-brand-50 text-brand-800 border border-brand-200 hover:bg-brand-100 transition flex items-center justify-center space-x-1";
            condoBtn.className = "py-2.5 px-2 rounded-2xl text-xs font-medium bg-brand-50 text-brand-800 border border-brand-200 hover:bg-brand-100 transition flex items-center justify-center space-x-1";
            aptBtn.className = "py-2.5 px-2 rounded-2xl text-xs font-medium bg-brand-50 text-brand-800 border border-brand-200 hover:bg-brand-100 transition flex items-center justify-center space-x-1";

            if (category === 'house') {
                houseBtn.className = "py-2.5 px-2 rounded-2xl text-xs font-bold bg-brand-600 text-white shadow-sm transition flex items-center justify-center space-x-1";
                nameLabel.innerText = "ชื่อโครงการบ้านจัดสรร";
                countInput.max = 15;
                countInput.value = 5;
                countLabel.innerText = "จำนวนหลังที่ต้องการสร้าง (สูงสุด 15)";
            } else if (category === 'condo') {
                condoBtn.className = "py-2.5 px-2 rounded-2xl text-xs font-bold bg-brand-600 text-white shadow-sm transition flex items-center justify-center space-x-1";
                nameLabel.innerText = "ชื่อโครงการคอนโดมิเนียม";
                countInput.max = 30;
                countInput.value = 10;
                countLabel.innerText = "จำนวนห้องที่ต้องการสร้าง (สูงสุด 30)";
            } else {
                aptBtn.className = "py-2.5 px-2 rounded-2xl text-xs font-bold bg-brand-600 text-white shadow-sm transition flex items-center justify-center space-x-1";
                nameLabel.innerText = "ชื่อตึกอพาร์ตเมนต์";
                countInput.max = 50;
                countInput.value = 20;
                countLabel.innerText = "จำนวนห้องที่ต้องการสร้าง (สูงสุด 50)";
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('file-name-display').innerText = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('image-preview');
                    preview.src = e.target.result;
                    document.getElementById('image-preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            
            const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', session.user.id).single();
            if (!profile || profile.role !== 'admin') { 
                showModal("Access Denied", "คุณไม่มีสิทธิ์เข้าถึงหน้าผู้ดูแลระบบนี้", "🚫", () => {
                    window.location.href = 'home.html';
                });
                return;
            }

            await loadPropertiesCatalog();
        });

        async function loadPropertiesCatalog() {
            const { data: properties, error } = await supabaseClient.from('properties').select('*').order('id', { ascending: false });
            const container = document.getElementById('estates-catalog-container');
            container.innerHTML = '';

            if (error || !properties || properties.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-gray-400 py-6">ยังไม่มีข้อมูลที่อยู่อาศัยในระบบ</p>';
                return;
            }

            properties.forEach(p => {
                let badgeColor = p.category === 'house' ? 'bg-brand-50 text-brand-700' : p.category === 'condo' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700';
                let categoryName = p.category === 'house' ? 'บ้าน' : p.category === 'condo' ? 'คอนโด' : 'อพาร์ตเมนต์';

                container.innerHTML += `
                    <div class="bg-white/95 backdrop-blur-md p-3.5 rounded-2xl border border-brand-100 shadow-sm flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <img src="${p.image_url || 'https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=150'}" class="w-12 h-12 rounded-xl object-cover border">
                            <div class="space-y-0.5">
                                <span class="text-[9px] font-bold px-2 py-0.5 rounded-full shadow-sm ${badgeColor}">${categoryName}</span>
                                <h4 class="font-bold text-xs text-brand-950 mt-1">${p.name} (ห้อง/หลัง: ${p.room_code})</h4>
                                <p class="text-[10px] text-gray-500">ซื้อ: <span class="font-semibold text-brand-600">${parseFloat(p.price_buy).toLocaleString()} Silver</span> | เช่า: <span class="font-semibold text-brand-600">${parseFloat(p.price_rent).toLocaleString()} Silver/สัปดาห์</span></p>
                            </div>
                        </div>
                        <button onclick="deleteProperty('${p.id}')" class="bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold text-xs px-3 py-1.5 rounded-xl transition shadow-sm shrink-0">ลบ</button>
                    </div>
                `;
            });
        }

        async function createEstateProject() {
            const name = document.getElementById('estate-name').value.trim();
            const priceBuy = parseFloat(document.getElementById('estate-price-buy').value);
            const priceRent = parseFloat(document.getElementById('estate-price-rent').value);
            const utilitiesCost = parseFloat(document.getElementById('estate-utilities').value);
            const count = parseInt(document.getElementById('estate-count').value);

            let maxLimit = selectedCategory === 'house' ? 15 : selectedCategory === 'condo' ? 30 : 50;

            if (!name || isNaN(priceBuy) || isNaN(priceRent) || isNaN(utilitiesCost) || isNaN(count)) {
                showModal("กรอกข้อมูลไม่ครบ", "กรุณากรอกชื่อ ราคา และจำนวนยูนิตให้ครบถ้วนถูกต้อง", "⚠️");
                return;
            }

            if (count < 1 || count > maxLimit) {
                showModal("จำนวนไม่ถูกต้อง", `ประเภท ${selectedCategory.toUpperCase()} สามารถสร้างได้สูงสุด ${maxLimit} ยูนิตต่อครั้ง`, "⚠️");
                return;
            }

            let imageUrl = 'https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=300';
            const submitBtn = document.getElementById('submit-btn');

            if (selectedFile) {
                try {
                    submitBtn.innerText = 'กำลังอัปโหลดรูปภาพ...';
                    submitBtn.disabled = true;
                    // เรียกใช้ฟังก์ชัน uploadToCloudinary จากไฟล์ cloudinary-config.js
                    imageUrl = await uploadToCloudinary(selectedFile);
                    if (!imageUrl) {
                        submitBtn.innerText = 'สร้างโครงการที่อยู่อาศัย (Create Estate)';
                        submitBtn.disabled = false;
                        return;
                    }
                } catch (err) {
                    showModal("อัปโหลดรูปภาพไม่สำเร็จ", "เกิดข้อผิดพลาดในการอัปโหลดรูปไปยัง Cloudinary", "❌");
                    submitBtn.innerText = 'สร้างโครงการที่อยู่อาศัย (Create Estate)';
                    submitBtn.disabled = false;
                    return;
                }
            }

            // สร้างรายการยูนิตตามจำนวนที่กำหนด (เช่น A-01, A-02 หรือ 101, 102)
            let insertBatch = [];
            for (let i = 1; i <= count; i++) {
                let codePrefix = selectedCategory === 'house' ? 'H' : selectedCategory === 'condo' ? 'C' : 'A';
                let roomCode = `${codePrefix}-${String(i).padStart(2, '0')}`;
                
                insertBatch.push({
                    category: selectedCategory,
                    name: name,
                    room_code: roomCode,
                    image_url: imageUrl,
                    price_buy: priceBuy,
                    price_rent: priceRent,
                    utilities_cost: utilitiesCost,
                    max_residents: selectedCategory === 'house' ? 4 : 2,
                    ownership_type: 'none'
                });
            }

            const { error } = await supabaseClient.from('properties').insert(insertBatch);

            submitBtn.innerText = 'สร้างโครงการที่อยู่อาศัย (Create Estate)';
            submitBtn.disabled = false;

            if (error) {
                showModal("เกิดข้อผิดพลาด", error.message, "❌");
                return;
            }

            showModal("สร้างโครงการสำเร็จ! 🎉", `เพิ่มที่อยู่อาศัย ${count} ยูนิต เข้าสู่ระบบเรียบร้อยแล้ว`, "🏡", () => {
                document.getElementById('estate-name').value = '';
                document.getElementById('estate-price-buy').value = '';
                document.getElementById('estate-price-rent').value = '';
                document.getElementById('estate-utilities').value = '';
                document.getElementById('estate-image-file').value = '';
                document.getElementById('file-name-display').innerText = 'ยังไม่ได้เลือกไฟล์';
                document.getElementById('image-preview-container').classList.add('hidden');
                selectedFile = null;
                loadPropertiesCatalog();
            });
        }

        async function deleteProperty(id) {
            const { error } = await supabaseClient.from('properties').delete().eq('id', id);
            if (error) { 
                showModal("เกิดข้อผิดพลาด", error.message, "❌"); 
                return; 
            }
            showModal("ลบที่อยู่อาศัยสำเร็จ", "ลบข้อมูลที่อยู่อาศัยออกจากระบบแล้ว", "🗑️", () => loadPropertiesCatalog());
        }
    </script>
</body>
</html>
