<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Log - S-Link</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e11d48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="cloudinary-config.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#4c0519',
                        }
                    },
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #fff5f5 0%, #ffe4e6 100%); color: #4c0519; min-height: 100vh; }
    </style>
</head>
<body class="flex flex-col items-center justify-start p-4 md:p-8 pb-20">

    <!-- Main Container -->
    <div class="w-full max-w-2xl space-y-6">
        
        <!-- Header Nav -->
        <div class="border-b border-brand-200 pb-4 mb-2 flex items-center justify-between">
            <div>
                <button onclick="location.href='home.html'" class="inline-flex items-center space-x-1 text-xs font-bold text-brand-600 hover:text-brand-800 transition mb-2">
                    <span>◀ กลับหน้าหลัก</span>
                </button>
                <h1 class="text-xl font-extrabold text-brand-900">✨ S-Link (Social)</h1>
            </div>
            <button onclick="openCreatePostModal()" class="bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold px-4 py-2 rounded-2xl transition shadow-md">
                + สร้างโพสต์
            </button>
        </div>

        <!-- Navigation Tabs -->
        <div class="grid grid-cols-4 gap-1 bg-brand-100/80 p-1.5 rounded-2xl text-center">
            <button id="nav-feed" onclick="switchSLinkTab('feed')" class="py-2 rounded-xl text-xs font-bold bg-brand-600 text-white shadow-sm transition">หน้าหลัก</button>
            <button id="nav-search" onclick="switchSLinkTab('search')" class="py-2 rounded-xl text-xs font-medium text-brand-800 hover:text-brand-600 transition">ค้นหา</button>
            <button id="nav-chat" onclick="switchSLinkTab('chat')" class="py-2 rounded-xl text-xs font-medium text-brand-800 hover:text-brand-600 transition">แชท</button>
            <button id="nav-profile" onclick="switchSLinkTab('profile')" class="py-2 rounded-xl text-xs font-medium text-brand-800 hover:text-brand-600 transition">โปรไฟล์</button>
        </div>

        <!-- View 1: หน้าหลัก (Feed) -->
        <div id="view-feed" class="space-y-4">
            <div id="feed-posts-container" class="space-y-4">
                <!-- โหลดโพสต์จาก JS -->
            </div>
        </div>

        <!-- View 2: หน้าค้นหา (Search) -->
        <div id="view-search" class="hidden space-y-4">
            <div class="bg-white/90 backdrop-blur-md p-4 rounded-3xl border border-brand-200 shadow-sm flex space-x-2">
                <input type="text" id="search-input" placeholder="ค้นหาชื่อผู้ใช้ หรือ Username..." class="flex-1 px-3.5 py-2.5 rounded-2xl border border-brand-200 text-xs bg-white focus:outline-none focus:border-brand-500 shadow-inner">
                <button onclick="searchUsers()" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2.5 rounded-2xl text-xs font-bold transition shadow-sm">ค้นหา</button>
            </div>
            <div id="search-results-container" class="space-y-3"></div>
        </div>

        <!-- View 3: หน้าแชท (Chat) -->
        <div id="view-chat" class="hidden space-y-4">
            <div id="chat-list-container" class="space-y-2"></div>
        </div>

        <!-- View 4: หน้าโปรไฟล์โซเชียล (Profile) -->
        <div id="view-profile" class="hidden space-y-4">
            <div class="bg-white/90 backdrop-blur-md p-6 rounded-3xl border border-brand-200 shadow-sm space-y-4">
                <div class="flex items-center space-x-4">
                    <img id="my-slink-avatar" src="" class="w-20 h-20 rounded-full object-cover border-2 border-brand-400 shadow-md">
                    <div>
                        <h3 id="my-slink-name" class="font-extrabold text-sm text-brand-900">-</h3>
                        <p id="my-slink-username" class="text-xs text-gray-500">@-</p>
                        <p id="my-slink-bio" class="text-xs text-gray-600 mt-1">-</p>
                    </div>
                </div>

                <div class="grid grid-cols-3 text-center border-y border-brand-100 py-3 text-xs">
                    <div>
                        <span id="my-post-count" class="font-extrabold text-brand-900 block text-sm">0</span>
                        <span class="text-gray-500 text-[11px]">โพสต์</span>
                    </div>
                    <div>
                        <span id="my-follower-count" class="font-extrabold text-brand-900 block text-sm">0</span>
                        <span class="text-gray-500 text-[11px]">ผู้ติดตาม</span>
                    </div>
                    <div class="cursor-pointer hover:opacity-80 transition" onclick="openFollowingModal(currentUserId)">
                        <span id="my-following-count" class="font-extrabold text-brand-900 block text-sm">0</span>
                        <span class="text-gray-500 text-[11px] underline">กำลังติดตาม</span>
                    </div>
                </div>

                <button onclick="openEditBioModal()" class="w-full bg-brand-50 hover:bg-brand-100 text-brand-700 font-bold py-2 rounded-2xl text-xs transition border border-brand-200 shadow-sm">
                    แก้ไขโปรไฟล์โซเชียล & ไบโอ
                </button>
            </div>

            <div class="space-y-3">
                <h4 class="text-xs font-bold text-brand-800 px-1">โพสต์ของคุณ</h4>
                <div id="my-posts-container" class="space-y-4"></div>
            </div>
        </div>

    </div>

    <!-- Modal: สร้างโพสต์ -->
    <div id="create-post-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-brand-200 max-w-md w-full p-6 space-y-4 transform transition-all scale-95 opacity-0 duration-200" id="post-modal-box">
            <h3 class="text-base font-bold text-brand-900 text-center">สร้างโพสต์ใหม่</h3>
            <textarea id="post-content-input" rows="3" placeholder="คุณกำลังคิดอะไรอยู่..." class="w-full px-3.5 py-2.5 rounded-2xl border border-brand-200 text-xs bg-white focus:outline-none focus:border-brand-500 shadow-inner resize-none"></textarea>
            
            <div>
                <label class="block text-[11px] font-semibold text-brand-800 mb-1">แนบรูปภาพ (ไม่ใส่ก็ได้ แสดงขนาดเต็มรูป)</label>
                <input type="file" id="post-image-input" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100 cursor-pointer">
            </div>

            <div class="flex space-x-2 pt-2">
                <button onclick="closeCreatePostModal()" class="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-300 transition">ยกเลิก</button>
                <button onclick="submitPost()" class="flex-1 bg-brand-600 text-white py-2.5 rounded-xl text-xs font-semibold hover:bg-brand-700 transition shadow-md">โพสต์</button>
            </div>
        </div>
    </div>

    <!-- Modal: ดูรายชื่อกำลังติดตาม -->
    <div id="following-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-brand-200 max-w-sm w-full p-6 space-y-4 transform transition-all scale-95 opacity-0 duration-200" id="following-modal-box">
            <h3 class="text-base font-bold text-brand-900 text-center">รายชื่อที่กำลังติดตาม</h3>
            <div id="following-list-container" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
            <button onclick="closeFollowingModal()" class="w-full bg-gray-200 text-gray-700 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-300 transition">ปิดหน้าต่าง</button>
        </div>
    </div>

    <!-- Modal: แก้ไขโปรไฟล์โซเชียล -->
    <div id="edit-bio-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-brand-200 max-w-sm w-full p-6 space-y-4 transform transition-all scale-95 opacity-0 duration-200" id="bio-modal-box">
            <h3 class="text-base font-bold text-brand-900 text-center">แก้ไขโปรไฟล์ S-Link</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-[11px] font-semibold text-brand-800 mb-1">Username (@)</label>
                    <input type="text" id="edit-username" placeholder="username" class="w-full px-3.5 py-2.5 rounded-2xl border border-brand-200 text-xs bg-white shadow-inner">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-brand-800 mb-1">คำอธิบาย (Bio)</label>
                    <textarea id="edit-bio" rows="2" placeholder="แนะนำตัวสั้นๆ..." class="w-full px-3.5 py-2.5 rounded-2xl border border-brand-200 text-xs bg-white shadow-inner resize-none"></textarea>
                </div>
            </div>
            <div class="flex space-x-2 pt-2">
                <button onclick="closeEditBioModal()" class="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-300 transition">ยกเลิก</button>
                <button onclick="saveBioChanges()" class="flex-1 bg-brand-600 text-white py-2.5 rounded-xl text-xs font-semibold hover:bg-brand-700 transition shadow-md">บันทึก</button>
            </div>
        </div>
    </div>

    <!-- Modal ทั่วไป -->
    <div id="custom-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-brand-200 max-w-sm w-full p-6 text-center transform transition-all scale-95 opacity-0 duration-200" id="modal-box">
            <div id="modal-icon" class="w-16 h-16 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">✨</div>
            <h3 id="modal-title" class="text-lg font-bold text-brand-900 mb-2">แจ้งเตือนระบบ</h3>
            <p id="modal-message" class="text-sm text-gray-600 mb-6">ข้อความแจ้งเตือน...</p>
            <button onclick="closeModal()" class="bg-brand-600 text-white px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-brand-700 transition w-full shadow-md">ตกลง</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://alyifbjuugctlqiwcrny.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_79rKUSpeFSZbPtUpEPtiEw_t_saz9Hk';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        let currentUserId = null;
        let currentUserProfile = null;
        let activeLikeIntervals = {};

        function showModal(title, message, icon = '✨') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUserId = session.user.id;

            await loadCurrentUserSLinkProfile();
            loadFeedPosts();
            setupRealtimeSubscriptions();
        });

        async function loadCurrentUserSLinkProfile() {
            const { data } = await supabaseClient.from('profiles').select('*').eq('id', currentUserId).single();
            if (data) {
                currentUserProfile = data;
                document.getElementById('my-slink-avatar').src = data.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150';
                document.getElementById('my-slink-name').innerText = data.name;
                document.getElementById('my-slink-username').innerText = '@' + (data.username || data.custom_id);
                document.getElementById('my-slink-bio').innerText = data.bio || 'ยังไม่มีคำอธิบายโปรไฟล์';
                
                document.getElementById('edit-username').value = data.username || '';
                document.getElementById('edit-bio').value = data.bio || '';

                loadMyStats();
            }
        }

        async function loadMyStats() {
            const { count: postCount } = await supabaseClient.from('s_link_posts').select('*', { count: 'exact', head: true }).eq('user_id', currentUserId);
            document.getElementById('my-post-count').innerText = postCount || 0;

            const { count: followerCount } = await supabaseClient.from('s_link_follows').select('*', { count: 'exact', head: true }).eq('following_id', currentUserId);
            const totalFollowers = (followerCount || 0) + (currentUserProfile.purchased_followers || 0);
            document.getElementById('my-follower-count').innerText = totalFollowers;

            const { count: followingCount } = await supabaseClient.from('s_link_follows').select('*', { count: 'exact', head: true }).eq('follower_id', currentUserId);
            document.getElementById('my-following-count').innerText = followingCount || 0;

            loadMyPosts();
        }

        function switchSLinkTab(tab) {
            Object.keys(activeLikeIntervals).forEach(k => clearInterval(activeLikeIntervals[k]));
            activeLikeIntervals = {};

            const tabs = ['feed', 'search', 'chat', 'profile'];
            tabs.forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                const view = document.getElementById(`view-${t}`);
                if (t === tab) {
                    btn.className = "py-2 rounded-xl text-xs font-bold bg-brand-600 text-white shadow-sm transition";
                    view.classList.remove('hidden');
                } else {
                    btn.className = "py-2 rounded-xl text-xs font-medium text-brand-800 hover:text-brand-600 transition";
                    view.classList.add('hidden');
                }
            });

            if (tab === 'feed') loadFeedPosts();
            if (tab === 'profile') loadMyStats();
            if (tab === 'chat') loadChatList();
        }

        // --- 1. หน้าฟีด (Feed) พร้อมระบบยอดไลค์ไหลเรียลไทม์ตามสเกลผู้ติดตาม ---
        async function loadFeedPosts() {
            const { data: follows } = await supabaseClient.from('s_link_follows').select('following_id').eq('follower_id', currentUserId);
            const followingIds = follows ? follows.map(f => f.following_id) : [];
            followingIds.push(currentUserId);

            const { data: posts } = await supabaseClient
                .from('s_link_posts')
                .select('id, content, image_url, created_at, profiles(id, name, avatar, purchased_followers)')
                .in('user_id', followingIds)
                .order('created_at', { ascending: false });

            const container = document.getElementById('feed-posts-container');
            container.innerHTML = '';

            if (!posts || posts.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-gray-400 py-10 bg-white/80 rounded-3xl border border-brand-100">ยังไม่มีโพสต์จากคุณหรือคนที่คุณติดตาม (ลองไปค้นหาเพื่อนเพื่อกดติดตามได้ที่หน้าค้นหา)</p>';
                return;
            }

            for (let post of posts) {
                const { count: realLikes } = await supabaseClient.from('s_link_likes').select('*', { count: 'exact', head: true }).eq('post_id', post.id);
                
                const { count: actualFollowers } = await supabaseClient.from('s_link_follows').select('*', { count: 'exact', head: true }).eq('following_id', post.profiles.id);
                const totalFanBase = (actualFollowers || 0) + (post.profiles.purchased_followers || 0);

                const randomPercent = 0.40 + (Math.abs(hashCode(post.id)) % 47) / 100;
                let targetAutoLikes = Math.floor(totalFanBase * randomPercent);
                if (totalFanBase === 0) targetAutoLikes = 2;

                const finalTotalTarget = (realLikes || 0) + targetAutoLikes;

                const { data: likesCheck } = await supabaseClient.from('s_link_likes').select('*').eq('post_id', post.id).eq('user_id', currentUserId).limit(1);
                const isLiked = likesCheck && likesCheck.length > 0;

                const card = document.createElement('div');
                card.className = "bg-white/90 backdrop-blur-md rounded-3xl border border-brand-200 shadow-sm overflow-hidden space-y-3 p-4";
                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <img src="${post.profiles.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150'}" class="w-10 h-10 rounded-full object-cover border border-brand-200">
                        <div>
                            <h5 class="font-bold text-xs text-brand-900">${post.profiles.name}</h5>
                            <p class="text-[10px] text-gray-400">${new Date(post.created_at).toLocaleString('th-TH')}</p>
                        </div>
                    </div>
                    ${post.content ? `<p class="text-xs text-gray-700 px-1 whitespace-pre-wrap">${post.content}</p>` : ''}
                    ${post.image_url ? `<div class="w-full bg-black flex justify-center items-center rounded-2xl overflow-hidden"><img src="${post.image_url}" class="w-full h-auto object-contain"></div>` : ''}
                    
                    <div class="flex items-center justify-between pt-2 border-t border-brand-100 text-xs">
                        <button onclick="toggleLike('${post.id}')" class="flex items-center space-x-1 font-bold ${isLiked ? 'text-red-500' : 'text-gray-500'} hover:text-red-500 transition">
                            <span>${isLiked ? '❤️' : '🤍'}</span>
                            <span id="like-count-${post.id}">0</span> ไลค์
                        </button>
                    </div>
                    
                    <div id="comments-box-${post.id}" class="space-y-2 pt-2 border-t border-brand-50 text-xs"></div>
                    <div class="flex space-x-2 pt-1">
                        <input type="text" id="comment-input-${post.id}" placeholder="แสดงความคิดเห็น..." class="flex-1 px-3 py-1.5 rounded-xl border border-brand-200 text-xs bg-white shadow-inner focus:outline-none focus:border-brand-500">
                        <button onclick="sendComment('${post.id}')" class="bg-brand-600 hover:bg-brand-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition">ส่ง</button>
                    </div>
                `;
                container.appendChild(card);
                loadComments(post.id);

                // เริ่มต้นการไหลขึ้นของยอดไลค์ตามสเกลผู้ติดตาม
                startLiveStreamingLikes(post.id, finalTotalTarget, totalFanBase);
            }
        }

        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return hash;
        }

        // ระบบไหลของยอดไลค์ตามสเกลจำนวนผู้ติดตาม (ยิ่งผู้ติดตามเยอะ ยิ่งไหลเร็วและบวกทีละเยอะขึ้น)
        function startLiveStreamingLikes(postId, targetLikes, fanBaseCount) {
            if (activeLikeIntervals[postId]) clearInterval(activeLikeIntervals[postId]);

            const spanEl = document.getElementById(`like-count-${postId}`);
            if (!spanEl) return;

            let currentLikes = Math.floor(targetLikes * 0.20);
            if (targetLikes <= 5) currentLikes = 0;

            spanEl.innerText = currentLikes.toLocaleString();

            activeLikeIntervals[postId] = setInterval(() => {
                if (currentLikes < targetLikes) {
                    const remaining = targetLikes - currentLikes;
                    let increment = 1;

                    // กำหนดสเกลการบวกตามจำนวนผู้ติดตาม (Fan Base)
                    if (fanBaseCount >= 1000000) {
                        // หลักล้าน: บวกทีละ 1,000 ถึง 5,000
                        increment = Math.floor(Math.random() * 4000) + 1000;
                    } else if (fanBaseCount >= 10000) {
                        // หลักหมื่น-แสน: บวกทีละ 100 ถึง 500
                        increment = Math.floor(Math.random() * 400) + 100;
                    } else if (fanBaseCount >= 1000) {
                        // หลักพัน: บวกทีละ 10 ถึง 30
                        increment = Math.floor(Math.random() * 20) + 10;
                    } else {
                        // หลักร้อยลงมา: บวกทีละ 1 ถึง 3
                        increment = Math.floor(Math.random() * 3) + 1;
                    }

                    if (increment > remaining) increment = remaining;

                    currentLikes += increment;
                    if (currentLikes > targetLikes) currentLikes = targetLikes;

                    spanEl.innerText = currentLikes.toLocaleString();
                } else {
                    clearInterval(activeLikeIntervals[postId]);
                }
            }, 500); // อัปเดตทุกๆ 0.5 วินาที
        }

        async function toggleLike(postId) {
            const { data: existing } = await supabaseClient.from('s_link_likes').select('*').eq('post_id', postId).eq('user_id', currentUserId).limit(1);
            if (existing && existing.length > 0) {
                await supabaseClient.from('s_link_likes').delete().eq('id', existing[0].id);
            } else {
                await supabaseClient.from('s_link_likes').insert([{ post_id: postId, user_id: currentUserId }]);
            }
        }

        async function loadComments(postId) {
            const { data: comments } = await supabaseClient.from('s_link_comments').select('id, comment, created_at, profiles(name)').eq('post_id', postId).order('created_at', { ascending: true });
            const box = document.getElementById(`comments-box-${postId}`);
            if (!box) return;
            box.innerHTML = '';
            if (comments) {
                comments.forEach(c => {
                    const cDiv = document.createElement('div');
                    cDiv.className = "text-[11px] bg-brand-50/60 p-2 rounded-xl";
                    cDiv.innerHTML = `<b>${c.profiles.name}:</b> ${c.comment}`;
                    box.appendChild(cDiv);
                });
            }
        }

        async function sendComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;
            await supabaseClient.from('s_link_comments').insert([{ post_id: postId, user_id: currentUserId, comment: text }]);
            input.value = '';
            loadComments(postId);
        }

        // --- 2. หน้าค้นหา (Search) ---
        async function searchUsers() {
            const keyword = document.getElementById('search-input').value.trim();
            if (!keyword) return;

            const { data: users } = await supabaseClient.from('profiles').select('*').ilike('name', `%${keyword}%`).neq('id', currentUserId);
            const container = document.getElementById('search-results-container');
            container.innerHTML = '';

            if (!users || users.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-gray-400 py-6 bg-white/80 rounded-3xl border border-brand-100">ไม่พบผู้ใช้งานนี้</p>';
                return;
            }

            for (let u of users) {
                const { data: followCheck } = await supabaseClient.from('s_link_follows').select('*').eq('follower_id', currentUserId).eq('following_id', u.id).limit(1);
                const isFollowing = followCheck && followCheck.length > 0;

                const card = document.createElement('div');
                card.className = "bg-white/90 backdrop-blur-md p-4 rounded-3xl border border-brand-200 shadow-sm flex items-center justify-between";
                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <img src="${u.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150'}" class="w-12 h-12 rounded-full object-cover border border-brand-200">
                        <div>
                            <h5 class="font-bold text-xs text-brand-900">${u.name}</h5>
                            <p class="text-[10px] text-gray-500">@${u.username || u.custom_id}</p>
                            <p class="text-[10px] text-gray-600 mt-0.5">${u.bio || '-'}</p>
                        </div>
                    </div>
                    <button onclick="toggleFollow('${u.id}', ${isFollowing})" class="px-4 py-2 rounded-2xl text-xs font-bold transition shadow-sm ${isFollowing ? 'bg-gray-200 text-gray-700 hover:bg-red-500 hover:text-white' : 'bg-brand-600 text-white hover:bg-brand-700'}">
                        ${isFollowing ? 'กำลังติดตาม' : '+ ติดตาม'}
                    </button>
                `;
                container.appendChild(card);
            }
        }

        async function toggleFollow(targetId, isFollowing) {
            if (isFollowing) {
                await supabaseClient.from('s_link_follows').delete().eq('follower_id', currentUserId).eq('following_id', targetId);
            } else {
                await supabaseClient.from('s_link_follows').insert([{ follower_id: currentUserId, following_id: targetId }]);
            }
            searchUsers();
        }

        // --- 3. หน้าแชท (Chat) ---
        async function loadChatList() {
            const { data: myFollowing } = await supabaseClient.from('s_link_follows').select('following_id').eq('follower_id', currentUserId);
            const followingIds = myFollowing ? myFollowing.map(f => f.following_id) : [];

            if (followingIds.length === 0) {
                document.getElementById('chat-list-container').innerHTML = '<p class="text-center text-xs text-gray-400 py-10 bg-white/80 rounded-3xl border border-brand-100">คุณยังไม่มีเพื่อนที่ติดตามกันและกัน (ต้องติดตามกันจึงจะสามารถส่งข้อความแชทได้)</p>';
                return;
            }

            const { data: mutuals } = await supabaseClient.from('s_link_follows').select('follower_id').eq('following_id', currentUserId).in('follower_id', followingIds);
            const mutualIds = mutuals ? mutuals.map(m => m.follower_id) : [];

            if (mutualIds.length === 0) {
                document.getElementById('chat-list-container').innerHTML = '<p class="text-center text-xs text-gray-400 py-10 bg-white/80 rounded-3xl border border-brand-100">ต้องติดตามกันและกันจึงจะสามารถแชทได้</p>';
                return;
            }

            const { data: users } = await supabaseClient.from('profiles').select('*').in('id', mutualIds);
            const container = document.getElementById('chat-list-container');
            container.innerHTML = '';

            users.forEach(u => {
                const card = document.createElement('div');
                card.className = "bg-white/90 backdrop-blur-md p-4 rounded-3xl border border-brand-200 shadow-sm flex items-center justify-between cursor-pointer hover:border-brand-400 transition";
                card.onclick = () => openChatRoom(u.id, u.name, u.avatar);
                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <img src="${u.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150'}" class="w-12 h-12 rounded-full object-cover border border-brand-200">
                        <div>
                            <h5 class="font-bold text-xs text-brand-900">${u.name}</h5>
                            <p class="text-[10px] text-emerald-600 font-bold">💬 คลิกเพื่อเปิดห้องแชทเรียลไทม์</p>
                        </div>
                    </div>
                    <span class="text-xs text-brand-600 font-bold">แชท ➔</span>
                `;
                container.appendChild(card);
            });
        }

        let activeChatUserId = null;
        async function openChatRoom(targetId, targetName, targetAvatar) {
            activeChatUserId = targetId;
            const container = document.getElementById('view-chat');
            container.innerHTML = `
                <div class="bg-white/90 backdrop-blur-md rounded-3xl border border-brand-200 shadow-sm flex flex-col h-[500px]">
                    <div class="p-4 border-b border-brand-100 flex items-center space-x-3">
                        <button onclick="loadChatList()" class="text-xs font-bold text-brand-600">◀ กลับ</button>
                        <img src="${targetAvatar}" class="w-9 h-9 rounded-full object-cover border">
                        <h4 class="font-bold text-xs text-brand-900">${targetName}</h4>
                    </div>
                    <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-brand-50/30"></div>
                    <div class="p-3 border-t border-brand-100 flex space-x-2">
                        <input type="text" id="chat-msg-input" placeholder="พิมพ์ข้อความ..." class="flex-1 px-3.5 py-2.5 rounded-2xl border border-brand-200 text-xs bg-white shadow-inner focus:outline-none focus:border-brand-500">
                        <button onclick="sendChatMessage()" class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2.5 rounded-2xl text-xs font-bold transition shadow-sm">ส่ง</button>
                    </div>
                </div>
            `;
            loadChatMessages();
        }

        async function loadChatMessages() {
            if (!activeChatUserId) return;
            const { data: msgs } = await supabaseClient
                .from('s_link_chats')
                .select('*')
                .or(`and(sender_id.eq.${currentUserId},receiver_id.eq.${activeChatUserId}),and(sender_id.eq.${activeChatUserId},receiver_id.eq.${currentUserId})`)
                .order('created_at', { ascending: true });

            const box = document.getElementById('chat-messages');
            if (!box) return;
            box.innerHTML = '';

            if (msgs) {
                msgs.forEach(m => {
                    const isMe = m.sender_id === currentUserId;
                    const mDiv = document.createElement('div');
                    mDiv.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
                    mDiv.innerHTML = `
                        <div class="max-w-[70%] px-4 py-2.5 rounded-2xl text-xs shadow-sm ${isMe ? 'bg-brand-600 text-white rounded-br-none' : 'bg-white text-brand-900 border border-brand-100 rounded-bl-none'}">
                            <p>${m.message}</p>
                            <span class="text-[9px] opacity-70 block text-right mt-1">${new Date(m.created_at).toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'})}</span>
                        </div>
                    `;
                    box.appendChild(mDiv);
                });
                box.scrollTop = box.scrollHeight;
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-msg-input');
            const text = input.value.trim();
            if (!text || !activeChatUserId) return;

            const { error } = await supabaseClient.from('s_link_chats').insert([{
                sender_id: currentUserId,
                receiver_id: activeChatUserId,
                message: text
            }]);

            if (error) {
                showModal("ส่งไม่สำเร็จ", "ต้องติดตามกันและกันจึงจะสามารถส่งข้อความได้", "⚠️");
                return;
            }
            input.value = '';
            loadChatMessages();
        }

        // Real-time Subscriptions (แชท & กดไลค์เรียลไทม์)
        function setupRealtimeSubscriptions() {
            supabaseClient.channel('s_link_chats_realtime')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 's_link_chats' }, payload => {
                    if (activeChatUserId && (payload.new.sender_id === activeChatUserId || payload.new.receiver_id === activeChatUserId)) {
                        loadChatMessages();
                    }
                })
                .subscribe();

            supabaseClient.channel('s_link_likes_realtime')
                .on('postgres_changes', { event: '*', schema: 'public', table: 's_link_likes' }, payload => {
                    const postId = payload.new ? payload.new.post_id : payload.old.post_id;
                    const spanEl = document.getElementById(`like-count-${postId}`);
                    if (spanEl) {
                        let currentVal = parseInt(spanEl.innerText.replace(/,/g, '')) || 0;
                        if (payload.eventType === 'INSERT') spanEl.innerText = (currentVal + 1).toLocaleString();
                        else if (payload.eventType === 'DELETE' && currentVal > 0) spanEl.innerText = (currentVal - 1).toLocaleString();
                    }
                })
                .subscribe();
        }

        // --- 4. หน้าโปรไฟล์ (Profile) ---
        async function loadMyPosts() {
            const { data: posts } = await supabaseClient.from('s_link_posts').select('*').eq('user_id', currentUserId).order('created_at', { ascending: false });
            const container = document.getElementById('my-posts-container');
            container.innerHTML = '';

            if (!posts || posts.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-gray-400 py-6 bg-white/80 rounded-3xl border border-brand-100">ยังไม่มีโพสต์ของคุณ</p>';
                return;
            }

            posts.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-white/90 backdrop-blur-md p-4 rounded-3xl border border-brand-200 shadow-sm space-y-3 relative";
                card.innerHTML = `
                    <button onclick="deletePost('${p.id}')" class="absolute top-4 right-4 text-[10px] bg-red-500/20 text-red-600 hover:bg-red-500 hover:text-white px-2.5 py-1 rounded-xl transition font-semibold">ลบโพสต์</button>
                    ${p.content ? `<p class="text-xs text-gray-700 pr-16 whitespace-pre-wrap">${p.content}</p>` : ''}
                    ${p.image_url ? `<div class="w-full bg-black flex justify-center items-center rounded-2xl overflow-hidden"><img src="${p.image_url}" class="w-full h-auto object-contain"></div>` : ''}
                `;
                container.appendChild(card);
            });
        }

        async function deletePost(postId) {
            await supabaseClient.from('s_link_posts').delete().eq('id', postId);
            loadMyStats();
            showModal("ลบสำเร็จ", "ลบโพสต์ของคุณเรียบร้อยแล้ว", "🗑️");
        }

        async function openFollowingModal(userId) {
            const { data: follows } = await supabaseClient.from('s_link_follows').select('following_id').eq('follower_id', userId);
            const followingIds = follows ? follows.map(f => f.following_id) : [];

            const container = document.getElementById('following-list-container');
            container.innerHTML = '';

            if (followingIds.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-gray-400 py-4">ยังไม่ได้ติดตามใคร</p>';
            } else {
                const { data: users } = await supabaseClient.from('profiles').select('*').in('id', followingIds);
                users.forEach(u => {
                    const item = document.createElement('div');
                    item.className = "flex items-center space-x-3 p-2.5 bg-brand-50/60 rounded-2xl";
                    item.innerHTML = `
                        <img src="${u.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150'}" class="w-9 h-9 rounded-full object-cover">
                        <div>
                            <h5 class="font-bold text-xs text-brand-900">${u.name}</h5>
                            <p class="text-[10px] text-gray-500">@${u.username || u.custom_id}</p>
                        </div>
                    `;
                    container.appendChild(item);
                });
            }

            const modal = document.getElementById('following-modal');
            const box = document.getElementById('following-modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
        }

        function closeFollowingModal() {
            const modal = document.getElementById('following-modal');
            const box = document.getElementById('following-modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        function openCreatePostModal() {
            document.getElementById('post-content-input').value = '';
            document.getElementById('post-image-input').value = '';
            const modal = document.getElementById('create-post-modal');
            const box = document.getElementById('post-modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
        }

        function closeCreatePostModal() {
            const modal = document.getElementById('create-post-modal');
            const box = document.getElementById('post-modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        async function submitPost() {
            const content = document.getElementById('post-content-input').value.trim();
            const imageFile = document.getElementById('post-image-input').files[0];

            if (!content && !imageFile) {
                showModal("ข้อมูลไม่ครบ", "กรุณาใส่ข้อความหรือเลือกรูปภาพอย่างน้อย 1 อย่าง", "⚠️");
                return;
            }

            showModal("กำลังโพสต์...", "กำลังอัปโหลดและสร้างโพสต์ของคุณ", "⏳");

            let imageUrl = null;
            if (imageFile) {
                imageUrl = await uploadToCloudinary(imageFile);
            }

            const { error } = await supabaseClient.from('s_link_posts').insert([{
                user_id: currentUserId,
                content: content,
                image_url: imageUrl
            }]);

            closeModal();
            closeCreatePostModal();

            if (!error) {
                showModal("สำเร็จ!", "สร้างโพสต์ใหม่เรียบร้อยแล้ว", "🎉");
                loadFeedPosts();
                loadMyStats();
            } else {
                showModal("ข้อผิดพลาด", error.message, "❌");
            }
        }

        function openEditBioModal() {
            const modal = document.getElementById('edit-bio-modal');
            const box = document.getElementById('bio-modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
        }

        function closeEditBioModal() {
            const modal = document.getElementById('edit-bio-modal');
            const box = document.getElementById('bio-modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        async function saveBioChanges() {
            const username = document.getElementById('edit-username').value.trim();
            const bio = document.getElementById('edit-bio').value.trim();

            showModal("กำลังบันทึก...", "กำลังอัปเดตข้อมูลโปรไฟล์ S-Link", "⏳");

            const { error } = await supabaseClient.from('profiles').update({
                username: username,
                bio: bio
            }).eq('id', currentUserId);

            closeModal();
            closeEditBioModal();

            if (!error) {
                showModal("สำเร็จ!", "อัปเดตโปรไฟล์เรียบร้อยแล้ว", "✨");
                loadCurrentUserSLinkProfile();
            } else {
                showModal("ข้อผิดพลาด", error.message, "❌");
            }
        }
    </script>
</body>
