<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Log - S-Link</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Google Fonts & Tailwind CSS -->

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="cloudinary-config.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',

                            800: '#9f1239',
                            900: '#4c0519',
                        }
                    },
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #fff5f5 0%, #ffe4e6 100%); color: #4c0519; min-height: 100vh; }
    </style>
</head>
<body class="flex flex-col items-center justify-start p-4 md:p-8 pb-20">

    <!-- Main Container -->
    <div class="w-full max-w-2xl space-y-6">
        
        <!-- Header Nav -->
        <div class="border-b border-brand-200 pb-4 mb-2 flex items-center justify-between">
            <div>
                <button onclick="location.href='home.html'" class="inline-flex items-center space-x-1 text-xs font-bold text-brand-600 hover:text-brand-800 transition mb-2">
                    <span>◀ กลับหน้าหลัก</span>
                </button>
                <h1 class="text-xl font-extrabold text-brand-900">✨ S-Link (Social)</h1>
            </div>
            <button onclick="openCreatePostModal()" class="bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold px-4 py-2 rounded-2xl transition shadow-md">
                + สร้างโพสต์
            </button>
        </div>

        <!-- Navigation Tabs -->
        <div class="grid grid-cols-4 gap-1 bg-brand-100/80 p-1.5 rounded-2xl text-center">
            <button id="nav-feed" onclick="switchSLinkTab('feed')" class="py-2 rounded-xl text-xs font-medium text-brand-800 hover:text-brand-600 transition">หน้าหลัก</button>
            <button id="nav-search" onclick="switchSLinkTab('search')" class="py-2 rounded-xl text-xs font-medium text-brand-800 hover:text-brand-600 transition">ค้นหา</button>
            <button id="nav-chat" onclick="switchSLinkTab('chat')" class="py-2 rounded-xl text-xs font-medium text-brand-800 hover:text-brand-600 transition">แชท</button>
            <button id="nav-profile" onclick="switchSLinkTab('profile')" class="py-2 rounded-xl text-xs font-medium text-brand-800 hover:text-brand-600 transition">โปรไฟล์</button>
        </div>

        <!-- View 1: หน้าหลัก (Feed) -->
        <div id="view-feed" class="space-y-4">
            <div id="feed-posts-container" class="space-y-4"></div>
        </div>

        <!-- View 2: หน้าค้นหา (Search) -->
        <div id="view-search" class="hidden space-y-4">
            <div class="bg-white/90 backdrop-blur-md p-4 rounded-3xl border border-brand-200 shadow-sm flex space-x-2">
                <input type="text" id="search-input" placeholder="ค้นหาชื่อผู้ใช้ หรือ Username..." class="flex-1 px-3.5 py-2.5 rounded-2xl border border-brand-200 text-xs bg-white focus:outline-none focus:border-brand-500 shadow-inner">
                <button onclick="searchUsers()" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2.5 rounded-2xl text-xs font-bold transition shadow-sm">ค้นหา</button>
            </div>
            <div id="search-results-container" class="space-y-3"></div>
        </div>

        <!-- View 3: หน้าแชท (Chat) -->
        <div id="view-chat" class="hidden space-y-4">
            <div class="flex justify-between items-center px-1">
                <h4 class="text-xs font-bold text-brand-800">กล่องข้อความและแชทกลุ่ม</h4>
                <button onclick="openCreateGroupModal()" class="bg-brand-600 hover:bg-brand-700 text-white text-[11px] font-bold px-3 py-1.5 rounded-xl transition shadow-sm">+ สร้างกลุ่ม</button>
            </div>
            <div id="chat-list-container" class="space-y-2"></div>
        </div>

        <!-- View 4: หน้าโปรไฟล์โซเชียล (Profile) -->
        <div id="view-profile" class="hidden space-y-4">
            <div class="bg-white/90 backdrop-blur-md p-6 rounded-3xl border border-brand-200 shadow-sm space-y-4">
                <div class="flex items-center space-x-4">
                    <img id="my-slink-avatar" src="" class="w-20 h-20 rounded-full object-cover border-2 border-brand-400 shadow-md">
                    <div>
                        <h3 id="my-slink-name" class="font-extrabold text-sm text-brand-900">-</h3>
                        <p id="my-slink-username" class="text-xs text-gray-500">@-</p>
                        <p id="my-slink-bio" class="text-xs text-gray-600 mt-1">-</p>
                    </div>
                </div>

                <div class="grid grid-cols-3 text-center border-y border-brand-100 py-3 text-xs">
                    <div>
                        <span id="my-post-count" class="font-extrabold text-brand-900 block text-sm">0</span>
                        <span class="text-gray-500 text-[11px]">โพสต์</span>
                    </div>
                    <div>
                        <span id="my-follower-count" class="font-extrabold text-brand-900 block text-sm">0</span>
                        <span class="text-gray-500 text-[11px]">ผู้ติดตาม</span>
                    </div>
                    <div class="cursor-pointer hover:opacity-80 transition" onclick="openFollowingModal(currentUserId)">
                        <span id="my-following-count" class="font-extrabold text-brand-900 block text-sm">0</span>
                        <span class="text-gray-500 text-[11px]">กำลังติดตาม</span>
                    </div>
                </div>

                <button onclick="openEditBioModal()" class="w-full bg-brand-50 hover:bg-brand-100 text-brand-700 font-bold py-2 rounded-2xl text-xs transition border border-brand-200 shadow-sm">
                    ✏️ แก้ไขโปรไฟล์โซเชียล (ชื่อ, รูป, Bio)
                </button>
            </div>

            <div class="space-y-3">
                <h4 class="text-xs font-bold text-brand-800 px-1">โพสต์ของคุณ</h4>
                <div id="my-posts-container" class="space-y-4"></div>
            </div>
        </div>

    </div>

    <!-- Modal: สร้างโพสต์ -->
    <div id="create-post-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-brand-200 max-w-md w-full p-6 space-y-4 transform transition-all scale-95 opacity-0 duration-200" id="post-modal-box">
            <h3 class="text-base font-bold text-brand-900 text-center">สร้างโพสต์ใหม่</h3>
            <textarea id="post-content-input" rows="3" placeholder="คุณกำลังคิดอะไรอยู่..." class="w-full px-3.5 py-2.5 rounded-2xl border border-brand-200 text-xs bg-white focus:outline-none focus:border-brand-500 shadow-inner resize-none"></textarea>
            
            <div>
                <label class="block text-[11px] font-semibold text-brand-800 mb-1">แนบรูปภาพ (ขนาดเต็มรูป ไม่ตัดสัดส่วน)</label>
                <input type="file" id="post-image-input" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100 cursor-pointer">
            </div>

            <div class="flex space-x-2 pt-2">
                <button onclick="closeCreatePostModal()" class="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-300 transition">ยกเลิก</button>
                <button onclick="submitPost()" class="flex-1 bg-brand-600 text-white py-2.5 rounded-xl text-xs font-semibold hover:bg-brand-700 transition shadow-md">โพสต์</button>
            </div>
        </div>
    </div>

    <!-- Modal: สร้างแชทกลุ่ม -->
    <div id="create-group-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">

            <h3 class="text-base font-bold text-brand-900 text-center">สร้างกลุ่มสนทนาใหม่</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-[11px] font-semibold text-brand-800 mb-1">ชื่อกลุ่ม</label>
                    <input type="text" id="group-name-input" placeholder="ตั้งชื่อกลุ่ม..." class="w-full px-3.5 py-2.5 rounded-2xl border border-brand-200 text-xs bg-white shadow-inner">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-brand-800 mb-1">รูปกลุ่ม (Avatar)</label>
                    <input type="file" id="group-avatar-input" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100 cursor-pointer">
                </div>
            </div>
            <div class="flex space-x-2 pt-2">
                <button onclick="closeCreateGroupModal()" class="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-300 transition">ยกเลิก</button>
                <button onclick="submitCreateGroup()" class="flex-1 bg-brand-600 text-white py-2.5 rounded-xl text-xs font-semibold hover:bg-brand-700 transition shadow-md">สร้างกลุ่ม</button>
            </div>
        </div>
    </div>

    <!-- Modal: เชิญสมาชิกเข้ากลุ่ม -->
    <div id="invite-member-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-brand-200 max-w-md w-full p-6 space-y-4 transform transition-all scale-95 opacity-0 duration-200" id="invite-modal-box">
            <h3 class="text-base font-bold text-brand-900 text-center">เชิญเพื่อนเข้ากลุ่ม</h3>
            <div id="invite-friends-list" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
            <button onclick="closeInviteModal()" class="w-full bg-gray-200 text-gray-700 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-300 transition">ปิด</button>
        </div>
    </div>

    <!-- Modal: ดูรายชื่อกำลังติดตาม -->
    <div id="following-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-brand-200 max-w-sm w-full p-6 space-y-4 transform transition-all scale-95 opacity-0 duration-200" id="following-modal-box">
            <h3 class="text-base font-bold text-brand-900 text-center">รายชื่อที่กำลังติดตาม</h3>
            <div id="following-list-container" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
            <button onclick="closeFollowingModal()" class="w-full bg-gray-200 text-gray-700 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-300 transition">ปิดหน้าต่าง</button>
        </div>
    </div>

    <!-- Modal: แก้ไขโปรไฟล์โซเชียล -->
    <div id="edit-bio-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-brand-200 max-w-md w-full p-6 space-y-4 transform transition-all scale-95 opacity-0 duration-200" id="bio-modal-box">
            <h3 class="text-base font-bold text-brand-900 text-center">แก้ไขโปรไฟล์ S-Link</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-[11px] font-semibold text-brand-800 mb-1">รูปโปรไฟล์โซเชียล (S-Link Avatar)</label>
                    <input type="file" id="edit-slink-avatar-file" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100 cursor-pointer">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-brand-800 mb-1">ชื่อโปรไฟล์โซเชียล (S-Link Name)</label>
                    <input type="text" id="edit-slink-name" placeholder="ชื่อใน S-Link" class="w-full px-3.5 py-2.5 rounded-2xl border border-brand-200 text-xs bg-white shadow-inner">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-brand-800 mb-1">Username (@)</label>
                    <input type="text" id="edit-username" placeholder="username" class="w-full px-3.5 py-2.5 rounded-2xl border border-brand-200 text-xs bg-white shadow-inner">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-brand-800 mb-1">คำอธิบาย (Bio)</label>
                    <textarea id="edit-bio" rows="2" placeholder="แนะนำตัวสั้นๆในโลกโซเชียล..." class="w-full px-3.5 py-2.5 rounded-2xl border border-brand-200 text-xs bg-white shadow-inner resize-none"></textarea>
                </div>
            </div>
            <div class="flex space-x-2 pt-2">
                <button onclick="closeEditBioModal()" class="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-300 transition">ยกเลิก</button>
                <button onclick="saveBioChanges()" class="flex-1 bg-brand-600 text-white py-2.5 rounded-xl text-xs font-semibold hover:bg-brand-700 transition shadow-md">บันทึก</button>
            </div>
        </div>
    </div>

    <!-- Modal ทั่วไป -->
    <div id="custom-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-brand-200 max-w-sm w-full p-6 text-center transform transition-all scale-95 opacity-0 duration-200" id="modal-box">
            <div id="modal-icon" class="w-16 h-16 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">✨</div>
            <h3 id="modal-title" class="text-lg font-bold text-brand-900 mb-2">แจ้งเตือนระบบ</h3>
            <p id="modal-message" class="text-sm text-gray-600 mb-6">ข้อความแจ้งเตือน...</p>
            <button onclick="closeModal()" class="bg-brand-600 text-white px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-brand-700 transition w-full shadow-md">ตกลง</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://alyifbjuugctlqiwcrny.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_79rKUSpeFSZbPtUpEPtiEw_t_saz9Hk';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        let currentUserId = null;
        let currentUserProfile = null;
        let activeLikeIntervals = {};

        function formatFollowerCount(num) {
            if (num < 1000) return num.toString();
            else if (num < 10000) return num.toLocaleString('en-US');
            else if (num < 1000000) return (num / 1000).toFixed(num % 1000 !== 0 ? 1 : 0).replace(/\B(?=(\d{3})+(?!\d))/g, ",") + 'K';
            else return (num / 1000000).toFixed(num % 1000000 !== 0 ? 1 : 0).replace(/\B(?=(\d{3})+(?!\d))/g, ",") + 'M';
        }

        function showModal(title, message, icon = '✨') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUserId = session.user.id;

            await loadCurrentUserSLinkProfile();
            const savedTab = localStorage.getItem('slink_active_tab') || 'feed';
            switchSLinkTab(savedTab, false);

            setupRealtimeSubscriptions();
        });

        async function loadCurrentUserSLinkProfile() {
            const { data } = await supabaseClient.from('profiles').select('*').eq('id', currentUserId).single();
            if (data) {
                currentUserProfile = data;
                const slinkAvatar = data.slink_avatar || data.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150';
                const slinkName = data.slink_name || data.name || 'ผู้ใช้งาน S-Link';

                document.getElementById('my-slink-avatar').src = slinkAvatar;
                document.getElementById('my-slink-name').innerText = slinkName;
                document.getElementById('my-slink-username').innerText = '@' + (data.username || data.custom_id);
                document.getElementById('my-slink-bio').innerText = data.bio || 'ยังไม่มีคำอธิบายโปรไฟล์';
                
                document.getElementById('edit-slink-name').value = slinkName;
                document.getElementById('edit-username').value = data.username || '';
                document.getElementById('edit-bio').value = data.bio || '';

                loadMyStats();
            }
        }

        async function loadMyStats() {
            const { count: postCount } = await supabaseClient.from('s_link_posts').select('*', { count: 'exact', head: true }).eq('user_id', currentUserId);
            document.getElementById('my-post-count').innerText = (postCount || 0).toLocaleString('en-US');

            const { count: followerCount } = await supabaseClient.from('s_link_follows').select('*', { count: 'exact', head: true }).eq('following_id', currentUserId);
            const totalFollowers = (followerCount || 0) + (currentUserProfile.purchased_followers || 0);
            document.getElementById('my-follower-count').innerText = formatFollowerCount(totalFollowers);

            const { count: followingCount } = await supabaseClient.from('s_link_follows').select('*', { count: 'exact', head: true }).eq('follower_id', currentUserId);
            document.getElementById('my-following-count').innerText = (followingCount || 0).toLocaleString('en-US');

            loadMyPosts();
        }

        function switchSLinkTab(tab, save = true) {
            if (save) localStorage.setItem('slink_active_tab', tab);

            Object.keys(activeLikeIntervals).forEach(k => clearInterval(activeLikeIntervals[k]));
            activeLikeIntervals = {};

            ['feed', 'search', 'chat', 'profile'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                const view = document.getElementById(`view-${t}`);
                if (t === tab) {
                    btn.className = "py-2 rounded-xl text-xs font-bold bg-brand-600 text-white shadow-sm transition";
                    view.classList.remove('hidden');
                } else {
                    btn.className = "py-2 rounded-xl text-xs font-medium text-brand-800 hover:text-brand-600 transition";
                    view.classList.add('hidden');
                }
            });

            if (tab === 'feed') loadFeedPosts();
            if (tab === 'profile') loadMyStats();
            if (tab === 'chat') loadChatList();
        }

        async function loadFeedPosts() {
            const { data: follows } = await supabaseClient.from('s_link_follows').select('following_id').eq('follower_id', currentUserId);
            const followingIds = follows ? follows.map(f => f.following_id) : [];
            followingIds.push(currentUserId);

            const { data: posts } = await supabaseClient
                .from('s_link_posts')
                .select('id, user_id, content, image_url, created_at, cached_likes, profiles(id, name, slink_name, avatar, slink_avatar, purchased_followers)')
                .in('user_id', followingIds)
                .order('created_at', { ascending: false });

            const container = document.getElementById('feed-posts-container');
            container.innerHTML = '';

            if (!posts || posts.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-gray-400 py-10 bg-white/80 rounded-3xl border border-brand-100">ยังไม่มีโพสต์จากคุณหรือคนที่คุณติดตาม</p>';
                return;
            }

            for (let post of posts) {
                renderPostCard(post, container, false);
            }
        }

        async function renderPostCard(post, container, isMyProfile = false) {
            const { count: realLikes } = await supabaseClient.from('s_link_likes').select('*', { count: 'exact', head: true }).eq('post_id', post.id);
            const { count: actualFollowers } = await supabaseClient.from('s_link_follows').select('*', { count: 'exact', head: true }).eq('following_id', post.profiles.id);
            const totalFanBase = (actualFollowers || 0) + (post.profiles.purchased_followers || 0);

            // คำนวณยอดเป้าหมายออโต้ไลค์ 40% - 86% ของผู้ติดตาม
            const randomPercent = 0.40 + (Math.abs(hashCode(post.id)) % 47) / 100;
            let targetAutoLikes = Math.floor(totalFanBase * randomPercent);
            if (totalFanBase === 0) targetAutoLikes = 5;

            const finalTotalTarget = (realLikes || 0) + targetAutoLikes;

            // ตรวจสอบยอดไลค์สะสมใน localStorage หรือ cached_likes
            const localSavedLikes = localStorage.getItem(`post_likes_${post.id}`);
            let cached = localSavedLikes !== null ? parseInt(localSavedLikes) : (post.cached_likes || 0);

            // หากเพิ่งสร้างโพสต์หรือค่าสะสมเป็น 0 ให้ตั้งค่าเริ่มต้นเป็น 40% ของเป้าหมายทันที
            if (!cached || cached === 0) {
                cached = Math.floor(finalTotalTarget * 0.40);
                if (cached === 0 && finalTotalTarget > 0) cached = 1;
            }
            if (cached > finalTotalTarget) cached = finalTotalTarget;

            const { data: likesCheck } = await supabaseClient.from('s_link_likes').select('*').eq('post_id', post.id).eq('user_id', currentUserId).limit(1);

        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return hash;
        }

        function startSlowStreamingLikes(postId, targetLikes, fanBaseCount, initialCached, isOwner) {
            if (activeLikeIntervals[postId]) clearInterval(activeLikeIntervals[postId]);

            const spanEl = document.getElementById(`like-count-${postId}`);
            if (!spanEl) return;

            let currentLikes = initialCached;
            if (currentLikes > targetLikes) currentLikes = targetLikes;
            spanEl.innerText = currentLikes.toLocaleString('en-US');

            // เพิ่มความเร็วในการไหลให้เห็นผลชัดเจน (ทุกๆ 3 - 6 วินาที)
            activeLikeIntervals[postId] = setInterval(async () => {
                if (currentLikes < targetLikes) {
                    const remaining = targetLikes - currentLikes;
                    let increment = Math.floor(Math.random() * 20) + 5;
                    if (fanBaseCount >= 10000) increment = Math.floor(Math.random() * 250) + 50;
                    
                    if (increment > remaining) increment = remaining;

                    currentLikes += increment;
                    spanEl.innerText = currentLikes.toLocaleString('en-US');

                    localStorage.setItem(`post_likes_${postId}`, currentLikes);
                    if (isOwner) {
                        await supabaseClient.from('s_link_posts').update({ cached_likes: currentLikes }).eq('id', postId);
                    }
                } else {
                    clearInterval(activeLikeIntervals[postId]);
                }
            }, Math.floor(Math.random() * 3000) + 3000);
        }

        async function toggleLike(postId, isOwner) {
            const { data: existing } = await supabaseClient.from('s_link_likes').select('*').eq('post_id', postId).eq('user_id', currentUserId).limit(1);
            
            const iconEl = document.getElementById(`like-icon-${postId}`);
            const btnEl = document.getElementById(`like-btn-${postId}`);
            const spanEl = document.getElementById(`like-count-${postId}`);
            
            let currentVal = parseInt(spanEl.innerText.replace(/,/g, '')) || 0;

            if (existing && existing.length > 0) {
                // ยกเลิกไลค์ (Unlike)
                await supabaseClient.from('s_link_likes').delete().eq('id', existing[0].id);
                if (iconEl) iconEl.innerText = '🤍';
                if (btnEl) btnEl.className = "flex items-center space-x-1 font-bold text-gray-500 hover:text-red-500 transition";
                currentVal = Math.max(0, currentVal - 1);
            } else {
                // กดไลค์ (Like)
                await supabaseClient.from('s_link_likes').insert([{ post_id: postId, user_id: currentUserId }]);
                if (iconEl) iconEl.innerText = '❤️';
                if (btnEl) btnEl.className = "flex items-center space-x-1 font-bold text-red-500 transition";
                currentVal += 1;
            }
            
            spanEl.innerText = currentVal.toLocaleString('en-US');
            localStorage.setItem(`post_likes_${postId}`, currentVal);
            if (isOwner) {
                await supabaseClient.from('s_link_posts').update({ cached_likes: currentVal }).eq('id', postId);
            }
        }

        function setupRealtimeSubscriptions() {
            supabaseClient.channel('s_link_chats_realtime')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 's_link_chats' }, payload => {
                    if (!isGroupChat && activeChatId && (payload.new.sender_id === activeChatId || payload.new.receiver_id === activeChatId)) loadChatMessages();
                })
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_group_messages' }, payload => {
                    if (isGroupChat && activeChatId && payload.new.group_id === activeChatId) loadChatMessages();
                })
                .subscribe();
        }

                            <div>
                                <h5 class="font-bold text-xs text-brand-900">${uName}</h5>
                                <p class="text-[10px] text-gray-500">@${u.username || u.custom_id}</p>
                            </div>
                        `;
                        container.appendChild(item);
                    });
                }

                const modal = document.getElementById('following-modal');
                const box = document.getElementById('following-modal-box');
                modal.classList.remove('hidden');
                setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
            })();
        }

        function closeFollowingModal() {
            const modal = document.getElementById('following-modal');
            const box = document.getElementById('following-modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        function openCreatePostModal() {
            document.getElementById('post-content-input').value = '';
            document.getElementById('post-image-input').value = '';
            const modal = document.getElementById('create-post-modal');
            const box = document.getElementById('post-modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
        }

        function closeCreatePostModal() {
            const modal = document.getElementById('create-post-modal');
            const box = document.getElementById('post-modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        async function submitPost() {
            const content = document.getElementById('post-content-input').value.trim();
            const imageFile = document.getElementById('post-image-input').files[0];

            if (!content && !imageFile) {
                showModal("ข้อมูลไม่ครบ", "กรุณาใส่ข้อความหรือเลือกรูปภาพอย่างน้อย 1 อย่าง", "⚠️");
                return;
            }

            showModal("กำลังโพสต์...", "กำลังอัปโหลดและสร้างโพสต์ของคุณ", "⏳");

            let imageUrl = null;
            if (imageFile) {
                imageUrl = await uploadToCloudinary(imageFile);
            }

            const { error } = await supabaseClient.from('s_link_posts').insert([{
                user_id: currentUserId,
                content: content,
                image_url: imageUrl,
                cached_likes: 0
            }]);

            closeModal();
            closeCreatePostModal();

            if (!error) {
                showModal("สำเร็จ!", "สร้างโพสต์ใหม่เรียบร้อยแล้ว", "🎉");
                loadFeedPosts();
                loadMyStats();
            } else {
                showModal("ข้อผิดพลาด", error.message, "❌");
            }
        }

        function openEditBioModal() {
            const modal = document.getElementById('edit-bio-modal');
            const box = document.getElementById('bio-modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
        }

        function closeEditBioModal() {
            const modal = document.getElementById('edit-bio-modal');
            const box = document.getElementById('bio-modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        async function saveBioChanges() {
            const slinkName = document.getElementById('edit-slink-name').value.trim();
            const username = document.getElementById('edit-username').value.trim();
            const bio = document.getElementById('edit-bio').value.trim();
            const avatarFile = document.getElementById('edit-slink-avatar-file').files[0];

            showModal("กำลังบันทึก...", "กำลังอัปเดตข้อมูลโปรไฟล์ S-Link", "⏳");

            let slinkAvatarUrl = currentUserProfile.slink_avatar || currentUserProfile.avatar;
            if (avatarFile) {
                slinkAvatarUrl = await uploadToCloudinary(avatarFile);
            }

            const { error } = await supabaseClient.from('profiles').update({
                slink_name: slinkName,
                username: username,
                bio: bio,
                slink_avatar: slinkAvatarUrl
            }).eq('id', currentUserId);

            closeModal();
            closeEditBioModal();

            if (!error) {
                showModal("สำเร็จ!", "อัปเดตโปรไฟล์ S-Link เรียบร้อยแล้ว", "✨");
                loadCurrentUserSLinkProfile();
            } else {
                showModal("ข้อผิดพลาด", error.message, "❌");
            }
        }
    </script>
</body>
</html>
